<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뽀잉보드 — 손그림 메모 · 마인드맵 · 표 · 그래프</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 손그림 감성 한글/영문 폰트 (Gaegu, Patrick Hand, Gowun Dodum) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Patrick+Hand&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       1. 기본 폰트 및 순수 연한 모눈종이(격자) 배경
       ========================================================================= */
    :root {
      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-soft: cubic-bezier(0.22, 1.4, 0.36, 1);
      --ink: #2c3440;
      --ink-soft: #5c6675;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Gaegu', 'Patrick Hand', 'Gowun Dodum', cursive, sans-serif;
      background-color: #fcfbf7;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 무한 캔버스 뷰포트: 따뜻한 연한 모눈종이 격자 */
    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      cursor: crosshair;
      background-color: #fcfbf7;
      background-image:
        linear-gradient(to right, rgba(130, 152, 182, 0.20) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(130, 152, 182, 0.20) 1px, transparent 1px),
        linear-gradient(to right, rgba(130, 152, 182, 0.085) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(130, 152, 182, 0.085) 1px, transparent 1px);
      background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
      background-position: 0px 0px;
    }

    #viewport.is-panning {
      cursor: grabbing;
    }

    /* 월드 레이어 (줌/패닝 변환 대상) */
    #world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* SVG 연결선 레이어 */
    #edges-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      overflow: visible;
      pointer-events: none;
    }

    #edges-layer .edge-hit {
      pointer-events: stroke;
      cursor: pointer;
    }

    /* =========================================================================
       2. 뽀잉뽀잉(Bouncy & Jelly) 탄성 애니메이션
       ========================================================================= */
    @keyframes boingSpawn {
      0%   { opacity: 0; transform: scale(0.32) rotate(-4deg) translateY(14px); }
      45%  { opacity: 1; transform: scale(1.10, 0.91) rotate(1.5deg) translateY(-4px); }
      72%  { transform: scale(0.95, 1.05) rotate(-0.8deg) translateY(1px); }
      88%  { transform: scale(1.02, 0.99) rotate(0.2deg); }
      100% { opacity: 1; transform: scale(1, 1) rotate(0deg) translateY(0); }
    }

    @keyframes toolbarPop {
      0%   { opacity: 0; transform: translate(-50%, 6px) scale(0.75); }
      65%  { opacity: 1; transform: translate(-50%, -2px) scale(1.05); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    @keyframes barGrow {
      0%   { transform: scaleY(0); }
      65%  { transform: scaleY(1.09); }
      100% { transform: scaleY(1); }
    }

    .animate-boing-spawn {
      animation: boingSpawn 0.54s var(--spring-soft) forwards;
    }

    .animate-toolbar-pop {
      animation: toolbarPop 0.3s var(--spring-bounce) forwards;
    }

    /* 손그림 느낌의 유기적 테두리 유틸리티 */
    .sketch-pill {
      border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
      border: 1.8px solid #3c4654;
      box-shadow: 2.5px 3px 0px rgba(44, 52, 64, 0.14);
    }

    .sketch-btn {
      transition: transform 0.26s var(--spring-bounce), background-color 0.16s ease;
    }
    .sketch-btn:hover {
      transform: translateY(-1.5px) scale(1.07);
    }
    .sketch-btn:active {
      transform: translateY(1px) scale(0.90);
    }

    /* =========================================================================
       3. 노드 래퍼 · 즉시 드래그 vs 편집 모드 제어
       ========================================================================= */
    .node-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
      touch-action: none;
      cursor: grab;
    }

    .node-wrapper:active {
      cursor: grabbing;
    }

    /*
      핵심 UX 개선:
      편집 모드가 아닐 때는 모든 입력 필드의 포인터 이벤트를 비활성화하여
      메모·말풍선·표·그래프 어디를 눌러도 즉시 부드럽게 드래그되도록 함!
      (한 번 톡 탭/클릭하면 is-editing이 켜지면서 바로 해당 위치 입력 시작)
    */
    .node-wrapper:not(.is-editing) .edit-field {
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .node-wrapper.is-editing {
      cursor: default;
    }

    .node-wrapper.is-editing .edit-field {
      pointer-events: auto;
      user-select: text;
      -webkit-user-select: text;
      touch-action: pan-y;
    }

    /* 선택 시 은은한 연필 하이라이트 글로우 */
    .node-wrapper.is-selected .sketch-bg-svg {
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.28));
    }

    .node-wrapper.is-drop-target .node-card {
      transform: scale(1.045);
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.45));
    }

    .node-card {
      position: relative;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s var(--spring-bounce), filter 0.2s ease;
    }

    /* 손그림 SVG 배경 레이어 */
    .sketch-bg-svg {
      position: absolute;
      inset: -6px;
      width: calc(100% + 12px);
      height: calc(100% + 12px);
      pointer-events: none;
      overflow: visible;
      z-index: 0;
    }

    .node-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    /* 선택 시 모바일에서도 크기 조절 핸들이 잘 보이도록 표시 */
    .node-wrapper.is-selected .resize-handle {
      opacity: 0.72;
    }

    /* 세로 크기를 직접 조절했을 때 그래프 SVG가 영역에 맞춰 유연하게 확대/축소 */
    .node-card.has-custom-height .chart-canvas svg {
      height: 100%;
      max-height: 100%;
    }

    /* 연결/가지치기 (+) 핸들 */
    .branch-handle {
      transition: transform 0.26s var(--spring-bounce), opacity 0.2s ease;
      border-radius: 55% 45% 58% 42% / 44% 56% 44% 56%;
    }
    .branch-handle:hover {
      transform: scale(1.26) rotate(8deg);
    }
    .branch-handle:active {
      transform: scale(0.88);
    }

    /* 얇은 스크롤바 */
    .thin-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.35);
      border-radius: 999px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    /* 손그림 그래프 막대 애니메이션 */
    .chart-bar-g {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: barGrow 0.48s var(--spring-bounce) forwards;
    }

    /* 손그림 표 점선 구분선 */
    .sketch-table td, .sketch-table th {
      border-color: rgba(60, 70, 84, 0.26);
    }

    /* 깔끔한 UI 보조 폰트 (아주 작은 라벨용) */
    .ui-sans {
      font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body>

  <!-- =========================================================================
       순수 연한 모눈종이 무한 캔버스 (하단 UI 없이 배경 클릭 -> 바로 메모!)
       ========================================================================= -->
  <div id="viewport" aria-label="손그림 모눈종이 캔버스">
    <div id="world">
      <!-- 손그림 마인드맵 연결선 레이어 -->
      <svg id="edges-layer">
        <g id="edges-group"></g>
        <!-- 드래그 중인 고무줄 손그림 연결선 -->
        <path id="temp-edge" d="" fill="none" stroke="#3b82f6" stroke-width="2.6" stroke-dasharray="7 6" stroke-linecap="round" class="hidden"></path>
      </svg>

      <!-- 노드 컨테이너 -->
      <div id="nodes-layer"></div>
    </div>
  </div>

  <!-- =========================================================================
       연결선 선택 시 뜨는 미니 끊기 버튼
       ========================================================================= -->
  <button id="edge-delete-btn" class="fixed z-40 hidden sketch-btn w-7 h-7 rounded-full bg-rose-500 text-white shadow-md flex items-center justify-center text-xs font-bold border-2 border-[#fcfbf7]" title="연결 끊기">
    ✕
  </button>

  <!-- =========================================================================
       우측 상단 초미니 점 3개(⋯) 메뉴
       (저장·불러오기·내보내기·실행 취소/다시 실행을 모두 한곳에 수납)
       ========================================================================= -->
  <div class="fixed top-3 right-3 z-30 ui-sans">
    <div class="relative">
      <button id="btn-more" type="button" class="sketch-btn w-9 h-9 rounded-full bg-[#fcfbf7]/85 hover:bg-white text-slate-500 opacity-55 hover:opacity-100 flex items-center justify-center border border-slate-300/80 shadow-sm backdrop-blur-sm" title="보드 메뉴">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>

      <!-- 미니 팝오버 -->
      <div id="more-popover" class="hidden absolute top-11 right-0 w-52 max-h-[calc(100vh-72px)] overflow-y-auto thin-scroll p-1.5 bg-[#fffef9]/95 backdrop-blur-md sketch-pill ui-sans text-xs font-medium text-slate-700 origin-top-right">
        <button id="btn-undo" type="button" class="w-full flex items-center justify-between px-3 py-2 rounded-xl hover:bg-amber-50/80 text-left disabled:opacity-35">
          <span>↩️ 되돌리기</span><span class="text-[10px] text-slate-400">Ctrl+Z</span>
        </button>
        <button id="btn-redo" type="button" class="w-full flex items-center justify-between px-3 py-2 rounded-xl hover:bg-amber-50/80 text-left disabled:opacity-35">
          <span>↪️ 다시 실행</span><span class="text-[10px] text-slate-400">Ctrl+Y</span>
        </button>
        <div class="h-px bg-slate-200/70 my-1"></div>
        <button id="btn-save-browser" type="button" class="w-full flex items-center justify-between px-3 py-2 rounded-xl hover:bg-amber-50/80 text-left">
          <span>💾 브라우저에 저장</span><span class="text-[10px] text-slate-400">Ctrl+S</span>
        </button>
        <button id="btn-open-storage" type="button" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-sky-50/80 text-left">
          <span>📂</span><span>불러오기 (보관함)</span>
        </button>
        <button id="btn-export" type="button" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-emerald-50/80 text-left">
          <span>📤</span><span>파일로 내보내기</span>
        </button>
        <button id="btn-import" type="button" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-slate-100/80 text-left">
          <span>📄</span><span>JSON 파일 불러오기</span>
        </button>
        <div class="h-px bg-slate-200/70 my-1"></div>
        <button id="btn-fit" type="button" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-amber-50/80 text-left">
          <span>🔍</span><span>전체 한눈에 보기</span>
        </button>
        <button id="btn-auto-layout" type="button" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-amber-50/80 text-left">
          <span>✨</span><span>마인드맵 깔끔 정리</span>
        </button>
        <button id="btn-sound" type="button" class="w-full flex items-center justify-between px-3 py-2 rounded-xl hover:bg-amber-50/80 text-left">
          <span>🔊 뽀잉 효과음</span><span id="sound-status" class="text-[11px] font-bold text-sky-600">ON</span>
        </button>
        <div class="h-px bg-slate-200/70 my-1"></div>
        <button id="btn-load-sample" type="button" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-sky-50/80 hover:text-sky-700 text-left">
          <span>✏️</span><span>예시 스케치 보기</span>
        </button>
        <button id="btn-clear-all" type="button" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-rose-50 hover:text-rose-600 text-left">
          <span>🧹</span><span>모눈종이 비우기</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 숨겨진 JSON 파일 업로드 -->
  <input id="file-import-input" type="file" accept=".json" class="hidden" />

  <!-- =========================================================================
       손그림 감성 토스트 & 확인 모달 (alert / confirm 대체)
       ========================================================================= -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-[-12px]">
    <div id="toast-inner" class="px-4 py-1.5 bg-[#2c3440] text-[#fcfbf7] text-base font-bold sketch-pill flex items-center gap-1.5 shadow-lg" style="background-color: rgba(44, 52, 64, 0.95); color: #fcfbf7; border-color: #1e2530;"></div>
  </div>

  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/20 backdrop-blur-[2px] p-4">
    <div class="animate-boing-spawn w-full max-w-xs bg-[#fffef9] sketch-pill p-5 text-center">
      <div id="confirm-icon" class="text-3xl mb-1.5">✏️</div>
      <h3 id="confirm-title" class="text-xl font-bold text-slate-800 mb-1">확인해 주세요</h3>
      <p id="confirm-desc" class="ui-sans text-xs text-slate-500 mb-5 leading-relaxed"></p>
      <div class="flex items-center gap-2 ui-sans">
        <button id="confirm-cancel" class="sketch-btn flex-1 py-2 rounded-2xl bg-slate-100 text-slate-600 text-xs font-semibold border border-slate-300/80">취소</button>
        <button id="confirm-ok" class="sketch-btn flex-1 py-2 rounded-2xl bg-rose-500 text-white text-xs font-semibold border border-rose-700/50 shadow-sm">확인</button>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       브라우저 저장소 보관함 모달 (여러 스케치 저장 / 불러오기 / 파일 내보내기)
       ========================================================================= -->
  <div id="storage-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/20 backdrop-blur-[2px] p-4">
    <div class="animate-boing-spawn w-full max-w-md bg-[#fffef9] sketch-pill p-5 flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📂</span>
          <div>
            <h3 class="text-xl font-bold text-slate-800 leading-tight">브라우저 보관함</h3>
            <p class="ui-sans text-[11px] text-slate-500">이 브라우저에 여러 스케치를 저장하고 언제든 불러오세요</p>
          </div>
        </div>
        <button id="storage-close-btn" type="button" class="sketch-btn w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-sm font-bold" title="닫기">✕</button>
      </div>

      <!-- 새 이름으로 브라우저 저장 -->
      <div class="p-3 rounded-2xl bg-amber-50/75 border border-dashed border-amber-400/70 mb-3 ui-sans">
        <label for="storage-name-input" class="block text-[11px] font-bold text-amber-900/80 mb-1.5">현재 스케치를 브라우저에 새 이름으로 저장</label>
        <div class="flex items-center gap-1.5">
          <input id="storage-name-input" type="text" maxlength="40" placeholder="스케치 이름 (예: 주간 아이디어)" class="flex-1 min-w-0 px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs text-slate-700 focus:outline-none focus:border-amber-500" />
          <button id="btn-modal-save-new" type="button" class="sketch-btn shrink-0 px-3.5 py-2 rounded-xl bg-[#2c3440] text-white text-xs font-bold shadow-sm">
            💾 저장
          </button>
        </div>
      </div>

      <!-- 저장된 보드 목록 -->
      <div class="flex items-center justify-between mb-1.5 ui-sans">
        <span class="text-[11px] font-bold text-slate-500">저장된 스케치 목록</span>
        <span id="storage-count-badge" class="text-[11px] font-bold text-sky-600">0개</span>
      </div>
      <div id="storage-list" class="thin-scroll flex-1 overflow-y-auto space-y-2 pr-0.5 min-h-[120px] max-h-[40vh]"></div>

      <!-- 하단 파일 불러오기 / 내보내기 바로가기 -->
      <div class="mt-4 pt-3 border-t border-dashed border-slate-300/80 flex items-center gap-2 ui-sans">
        <button id="btn-modal-import-file" type="button" class="sketch-btn flex-1 py-2.5 rounded-2xl bg-sky-50 hover:bg-sky-100 text-sky-800 text-xs font-bold border border-sky-300/70 flex items-center justify-center gap-1.5">
          <span>📄</span><span>파일에서 불러오기</span>
        </button>
        <button id="btn-modal-export-file" type="button" class="sketch-btn flex-1 py-2.5 rounded-2xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold border border-emerald-300/70 flex items-center justify-center gap-1.5">
          <span>📤</span><span>파일로 내보내기</span>
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       메인 JavaScript 애플리케이션
       ========================================================================= -->
  <script>
    (() => {
      'use strict';

      /* -----------------------------------------------------------------------
         1. 상수 및 손그림 형광펜(마커) 컬러 팔레트
         ----------------------------------------------------------------------- */
      const STORAGE_KEY = 'boingboard_sketch_v2';
      const SAVED_SLOTS_KEY = 'boingboard_saved_slots_v1';

      const COLOR_THEMES = {
        paper:    { fill: '#fffefb', stroke: '#3a4250', accent: '#475569', dot: '#f5f2e9', soft: '#f1efe8', text: '#262d38' },
        lemon:    { fill: '#fff9d6', stroke: '#4a3f28', accent: '#d97706', dot: '#fde68a', soft: '#fef3c7', text: '#3d3017' },
        mint:     { fill: '#e6f9ef', stroke: '#29473a', accent: '#059669', dot: '#a7f3d0', soft: '#d1fae5', text: '#1d3b2f' },
        sky:      { fill: '#e6f4ff', stroke: '#263e54', accent: '#0284c7', dot: '#bae6fd', soft: '#e0f2fe', text: '#1c3347' },
        lavender: { fill: '#f3ebff', stroke: '#3c2d54', accent: '#7c3aed', dot: '#ddd6fe', soft: '#ede9fe', text: '#2f2147' },
        peach:    { fill: '#ffe9ec', stroke: '#522c34', accent: '#e11d48', dot: '#fecdd3', soft: '#ffe4e6', text: '#472129' }
      };

      const CHART_PALETTE = ['#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#fb7185', '#38bdf8', '#f472b6', '#a3e635'];

      /* -----------------------------------------------------------------------
         2. 손그림(Sketch) SVG 경로 생성기 (결정적 난수로 일관된 삐뚤빼뚤 손맛!)
         ----------------------------------------------------------------------- */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const Sketch = {
        // 한 번의 손그림 직선 (살짝 휘어지고 양 끝이 살짝 어긋난 펜선)
        line(x1, y1, x2, y2, rng, rough = 1.5) {
          const j = () => (rng() - 0.5) * rough * 2;
          const mx = (x1 + x2) / 2 + j() * 1.4;
          const my = (y1 + y2) / 2 + j() * 1.4;
          return `M ${(x1 + j() * 0.6).toFixed(1)} ${(y1 + j() * 0.6).toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${(x2 + j() * 0.6).toFixed(1)} ${(y2 + j() * 0.6).toFixed(1)}`;
        },

        // 손그림 메모/표/그래프용 삐뚤빼뚤 사각 프레임 (마커 채우기 + 2중 펜 외곽선)
        rectPaths(w, h, seed, rough = 1.7) {
          const rng = mulberry32(seed);
          const p = 6; // SVG inset padding
          const x = p, y = p;
          const r = Math.min(18, w * 0.12, h * 0.2);

          const j = (mul = 1) => (rng() - 0.5) * rough * 2 * mul;

          // 부드러운 손그림 채우기 패스 (약간 비대칭적인 유기적 모서리)
          const x0 = x + j(0.7), y0 = y + j(0.7);
          const x1 = x + w + j(0.7), y1 = y + j(0.7);
          const x2 = x + w + j(0.7), y2 = y + h + j(0.7);
          const x3 = x + j(0.7), y3 = y + h + j(0.7);

          const fillPath = [
            `M ${(x0 + r).toFixed(1)} ${y0.toFixed(1)}`,
            `Q ${(x + w * 0.5 + j(1.1)).toFixed(1)} ${(y + j(1.2)).toFixed(1)} ${(x1 - r).toFixed(1)} ${y1.toFixed(1)}`,
            `Q ${(x1 + j(0.8)).toFixed(1)} ${(y1 + j(0.8)).toFixed(1)} ${x1.toFixed(1)} ${(y1 + r).toFixed(1)}`,
            `Q ${(x + w + j(1.2)).toFixed(1)} ${(y + h * 0.5 + j(1.1)).toFixed(1)} ${x2.toFixed(1)} ${(y2 - r).toFixed(1)}`,
            `Q ${(x2 + j(0.8)).toFixed(1)} ${(y2 + j(0.8)).toFixed(1)} ${(x2 - r).toFixed(1)} ${y2.toFixed(1)}`,
            `Q ${(x + w * 0.5 + j(1.1)).toFixed(1)} ${(y + h + j(1.2)).toFixed(1)} ${(x3 + r).toFixed(1)} ${y3.toFixed(1)}`,
            `Q ${(x3 + j(0.8)).toFixed(1)} ${(y3 + j(0.8)).toFixed(1)} ${x3.toFixed(1)} ${(y3 - r).toFixed(1)}`,
            `Q ${(x + j(1.2)).toFixed(1)} ${(y + h * 0.5 + j(1.1)).toFixed(1)} ${x0.toFixed(1)} ${(y0 + r).toFixed(1)}`,
            `Q ${(x0 + j(0.8)).toFixed(1)} ${(y0 + j(0.8)).toFixed(1)} ${(x0 + r).toFixed(1)} ${y0.toFixed(1)} Z`
          ].join(' ');

          // 두 번째 덧그린 펜선 (실제 손으로 두 번 쓱 그린 듯한 느낌)
          const stroke2 = [
            `M ${(x0 + r + j()).toFixed(1)} ${(y0 + j()).toFixed(1)}`,
            `Q ${(x + w * 0.52 + j(1.3)).toFixed(1)} ${(y + j(1.4)).toFixed(1)} ${(x1 - r + j()).toFixed(1)} ${(y1 + j()).toFixed(1)}`,
            `Q ${(x1 + j()).toFixed(1)} ${(y1 + j()).toFixed(1)} ${(x1 + j()).toFixed(1)} ${(y1 + r + j()).toFixed(1)}`,
            `Q ${(x + w + j(1.4)).toFixed(1)} ${(y + h * 0.48 + j(1.3)).toFixed(1)} ${(x2 + j()).toFixed(1)} ${(y2 - r + j()).toFixed(1)}`,
            `Q ${(x2 + j()).toFixed(1)} ${(y2 + j()).toFixed(1)} ${(x2 - r + j()).toFixed(1)} ${(y2 + j()).toFixed(1)}`,
            `Q ${(x + w * 0.48 + j(1.3)).toFixed(1)} ${(y + h + j(1.4)).toFixed(1)} ${(x3 + r + j()).toFixed(1)} ${(y3 + j()).toFixed(1)}`,
            `Q ${(x3 + j()).toFixed(1)} ${(y3 + j()).toFixed(1)} ${(x3 + j()).toFixed(1)} ${(y3 - r + j()).toFixed(1)}`,
            `Q ${(x + j(1.4)).toFixed(1)} ${(y + h * 0.52 + j(1.3)).toFixed(1)} ${(x0 + j()).toFixed(1)} ${(y0 + r + j()).toFixed(1)}`,
            `Q ${(x0 + j()).toFixed(1)} ${(y0 + j()).toFixed(1)} ${(x0 + r + j()).toFixed(1)} ${(y0 + j()).toFixed(1)}`
          ].join(' ');

          return { fillPath, stroke1: fillPath, stroke2 };
        },

        // 마인드맵 말풍선/구름 타원 손그림 (키워드에 펜으로 동그라미 친 듯한 느낌)
        bubblePaths(w, h, seed) {
          const rng = mulberry32(seed);
          const p = 6;
          const cx = p + w / 2;
          const cy = p + h / 2;
          const rx = w / 2;
          const ry = h / 2;

          const buildLoop = (rough, extraSweep = 0) => {
            const steps = 16;
            const pts = [];
            for (let i = 0; i <= steps + extraSweep; i++) {
              const angle = (i / steps) * Math.PI * 2 - Math.PI / 2;
              // 타원보다 모서리가 살짝 둥근 슈퍼엘립스(squircle) 느낌으로 글자가 잘림 없이 들어감
              const cos = Math.cos(angle);
              const sin = Math.sin(angle);
              const signX = cos >= 0 ? 1 : -1;
              const signY = sin >= 0 ? 1 : -1;
              const px = cx + signX * Math.pow(Math.abs(cos), 0.78) * rx + (rng() - 0.5) * rough * 2.4;
              const py = cy + signY * Math.pow(Math.abs(sin), 0.78) * ry + (rng() - 0.5) * rough * 2.2;
              pts.push({ x: px, y: py });
            }

            let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
            for (let i = 1; i < pts.length; i++) {
              const prev = pts[i - 1];
              const cur = pts[i];
              const mx = (prev.x + cur.x) / 2;
              const my = (prev.y + cur.y) / 2;
              d += ` Q ${prev.x.toFixed(1)} ${prev.y.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
            }
            const last = pts[pts.length - 1];
            d += ` L ${last.x.toFixed(1)} ${last.y.toFixed(1)}`;
            return d;
          };

          const fillPath = buildLoop(1.4, 0) + ' Z';
          const stroke2 = buildLoop(1.9, 1);
          return { fillPath, stroke1: fillPath, stroke2 };
        },

        // 손그림 화살표 팁 계산
        arrowHead(tipX, tipY, fromX, fromY, seed) {
          const rng = mulberry32(seed + 77);
          const angle = Math.atan2(tipY - fromY, tipX - fromX);
          const len = 10.5;
          const a1 = angle - Math.PI * 0.82 + (rng() - 0.5) * 0.14;
          const a2 = angle + Math.PI * 0.82 + (rng() - 0.5) * 0.14;
          const x1 = tipX + Math.cos(a1) * len;
          const y1 = tipY + Math.sin(a1) * len;
          const x2 = tipX + Math.cos(a2) * len;
          const y2 = tipY + Math.sin(a2) * len;
          return `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${((x1 + tipX) / 2 + (rng() - 0.5) * 2).toFixed(1)} ${((y1 + tipY) / 2 + (rng() - 0.5) * 2).toFixed(1)} ${tipX.toFixed(1)} ${tipY.toFixed(1)} Q ${((x2 + tipX) / 2 + (rng() - 0.5) * 2).toFixed(1)} ${((y2 + tipY) / 2 + (rng() - 0.5) * 2).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
        }
      };

      /* -----------------------------------------------------------------------
         3. Web Audio API 뽀잉뽀잉 사운드 엔진
         ----------------------------------------------------------------------- */
      const SoundEngine = {
        ctx: null,
        enabled: true,

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        },

        play(type = 'pop') {
          if (!this.enabled) return;
          try {
            this.init();
            if (!this.ctx) return;

            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            if (type === 'spawn') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(290, now);
              osc.frequency.exponentialRampToValueAtTime(640, now + 0.085);
              osc.frequency.exponentialRampToValueAtTime(470, now + 0.16);
              gain.gain.setValueAtTime(0.001, now);
              gain.gain.linearRampToValueAtTime(0.10, now + 0.018);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
              osc.start(now);
              osc.stop(now + 0.19);
            } else if (type === 'boing') {
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(230, now);
              osc.frequency.exponentialRampToValueAtTime(510, now + 0.075);
              osc.frequency.exponentialRampToValueAtTime(350, now + 0.16);
              osc.frequency.exponentialRampToValueAtTime(425, now + 0.23);
              gain.gain.setValueAtTime(0.001, now);
              gain.gain.linearRampToValueAtTime(0.085, now + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
              osc.start(now);
              osc.stop(now + 0.26);
            } else if (type === 'delete') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(430, now);
              osc.frequency.exponentialRampToValueAtTime(160, now + 0.13);
              gain.gain.setValueAtTime(0.075, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
              osc.start(now);
              osc.stop(now + 0.15);
            } else {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(520, now);
              osc.frequency.exponentialRampToValueAtTime(760, now + 0.05);
              gain.gain.setValueAtTime(0.055, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
              osc.start(now);
              osc.stop(now + 0.065);
            }
          } catch (e) {
            // 오디오 컨텍스트 예외 무시
          }
        }
      };

      /* -----------------------------------------------------------------------
         4. 전역 상태, 물리 엔진 & Undo 스택
         ----------------------------------------------------------------------- */
      const state = {
        nodes: [],
        edges: [],
        panX: 0,
        panY: 0,
        zoom: 1,
        selectedNodeId: null,
        editingNodeId: null,
        selectedEdgeId: null,
        currentSlotId: null,
        currentBoardName: ''
      };

      const undoStack = [];
      const redoStack = [];
      const MAX_UNDO = 25;

      const nodePhysics = new Map();
      let physicsRafId = null;

      const viewportEl = document.getElementById('viewport');
      const worldEl = document.getElementById('world');
      const nodesLayerEl = document.getElementById('nodes-layer');
      const edgesGroupEl = document.getElementById('edges-group');
      const tempEdgeEl = document.getElementById('temp-edge');
      const edgeDeleteBtnEl = document.getElementById('edge-delete-btn');
      const morePopoverEl = document.getElementById('more-popover');

      const nodeElements = new Map();

      // 노드 크기 변화에 따라 손그림 테두리 SVG 자동 재계산
      const nodeResizeObserver = typeof ResizeObserver !== 'undefined'
        ? new ResizeObserver(entries => {
            for (const entry of entries) {
              const wrapper = entry.target.closest('.node-wrapper');
              if (!wrapper) continue;
              const node = state.nodes.find(n => n.id === wrapper.dataset.id);
              if (node) updateNodeSketch(node, wrapper);
            }
            renderEdges();
          })
        : null;

      /* -----------------------------------------------------------------------
         5. 유틸리티 함수
         ----------------------------------------------------------------------- */
      function genId(prefix = 'n') {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      }

      function genSeed() {
        return Math.floor(Math.random() * 999999) + 1;
      }

      function clamp(val, min, max) {
        return Math.min(max, Math.max(min, val));
      }

      function screenToWorld(clientX, clientY) {
        return {
          x: (clientX - state.panX) / state.zoom,
          y: (clientY - state.panY) / state.zoom
        };
      }

      function worldToScreen(wx, wy) {
        return {
          x: wx * state.zoom + state.panX,
          y: wy * state.zoom + state.panY
        };
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      let toastTimer = null;
      function showToast(msg, icon = '✏️') {
        const toast = document.getElementById('toast');
        const inner = document.getElementById('toast-inner');
        inner.innerHTML = `<span>${icon}</span><span>${escapeHtml(msg)}</span>`;
        toast.classList.remove('opacity-0', 'translate-y-[-12px]');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-[-12px]');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 2000);
      }

      function showConfirm({ title, desc, icon = '✏️', okText = '확인', onConfirm }) {
        const modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-title').textContent = title;
        document.getElementById('confirm-desc').textContent = desc;
        document.getElementById('confirm-icon').textContent = icon;
        const okBtn = document.getElementById('confirm-ok');
        const cancelBtn = document.getElementById('confirm-cancel');
        okBtn.textContent = okText;

        modal.classList.remove('hidden');
        modal.classList.add('flex');

        const cleanup = () => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
          okBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        cancelBtn.onclick = () => {
          SoundEngine.play('click');
          cleanup();
        };
        okBtn.onclick = () => {
          cleanup();
          if (typeof onConfirm === 'function') onConfirm();
        };
      }

      /* -----------------------------------------------------------------------
         6. 저장 & Undo 관리
         ----------------------------------------------------------------------- */
      let saveTimeout = null;
      function scheduleSave() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          saveWorkingStateNow();
        }, 250);
      }

      // 현재 작업 상태를 브라우저 기본 영역에 즉시 기록
      function saveWorkingStateNow() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            nodes: state.nodes,
            edges: state.edges,
            panX: state.panX,
            panY: state.panY,
            zoom: state.zoom,
            currentSlotId: state.currentSlotId,
            currentBoardName: state.currentBoardName
          }));
          return true;
        } catch (e) {
          return false;
        }
      }

      // 브라우저 보관함 슬롯 목록 읽기 / 쓰기
      function getSavedSlots() {
        try {
          const raw = localStorage.getItem(SAVED_SLOTS_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function persistSavedSlots(slots) {
        try {
          localStorage.setItem(SAVED_SLOTS_KEY, JSON.stringify(slots));
          return true;
        } catch (e) {
          showToast('브라우저 저장 공간이 부족해요. 파일로 내보내 주세요!', '⚠️');
          return false;
        }
      }

      function inferBoardName() {
        if (state.currentBoardName && state.currentBoardName.trim()) {
          return state.currentBoardName.trim();
        }
        const firstTitled = state.nodes.find(n => (n.title || '').trim());
        if (firstTitled) return firstTitled.title.trim().slice(0, 26);
        const firstContent = state.nodes.find(n => (n.content || '').trim());
        if (firstContent) return firstContent.content.trim().split(/\r?\n/)[0].slice(0, 26);
        return '내 손그림 스케치';
      }

      function formatSavedTime(ts) {
        const d = new Date(ts || Date.now());
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        return `${mm}/${dd} ${hh}:${mi}`;
      }

      // 저장 버튼 클릭 시 브라우저에 명시적으로 저장 (현재 슬롯 업데이트 또는 새 슬롯 생성)
      function saveCurrentToBrowser({ asNew = false, customName = '', overwriteSlotId = null } = {}) {
        const slots = getSavedSlots();
        const name = (customName || '').trim() || inferBoardName();
        const snapshot = {
          nodes: JSON.parse(JSON.stringify(state.nodes)),
          edges: JSON.parse(JSON.stringify(state.edges)),
          panX: state.panX,
          panY: state.panY,
          zoom: state.zoom
        };

        let targetId = overwriteSlotId || (!asNew ? state.currentSlotId : null);
        const existingIdx = targetId ? slots.findIndex(s => s.id === targetId) : -1;
        const now = Date.now();

        if (existingIdx >= 0) {
          const updated = {
            ...slots[existingIdx],
            name: customName.trim() ? customName.trim() : slots[existingIdx].name,
            updatedAt: now,
            nodeCount: state.nodes.length,
            edgeCount: state.edges.length,
            data: snapshot
          };
          slots.splice(existingIdx, 1);
          slots.unshift(updated);
          state.currentSlotId = updated.id;
          state.currentBoardName = updated.name;
        } else {
          const newSlot = {
            id: genId('slot'),
            name,
            updatedAt: now,
            nodeCount: state.nodes.length,
            edgeCount: state.edges.length,
            data: snapshot
          };
          slots.unshift(newSlot);
          state.currentSlotId = newSlot.id;
          state.currentBoardName = newSlot.name;
        }

        if (!persistSavedSlots(slots)) return;
        saveWorkingStateNow();

        // 메뉴 버튼 뽀잉 피드백
        const moreBtn = document.getElementById('btn-more');
        if (moreBtn) {
          moreBtn.style.transform = 'scale(1.16)';
          setTimeout(() => { moreBtn.style.transform = ''; }, 180);
        }

        SoundEngine.play('boing');
        showToast(`"${state.currentBoardName}" 브라우저에 저장했어요!`, '💾');
        renderStorageSlotsList();
      }

      // 브라우저 보관함에서 선택한 보드 불러오기
      function loadSlotFromBrowser(slotId) {
        const slots = getSavedSlots();
        const slot = slots.find(s => s.id === slotId);
        if (!slot || !slot.data) {
          showToast('저장된 데이터를 찾을 수 없어요', '⚠️');
          return;
        }

        pushUndo();
        state.nodes = JSON.parse(JSON.stringify(slot.data.nodes || []));
        state.edges = JSON.parse(JSON.stringify(slot.data.edges || []));
        state.panX = typeof slot.data.panX === 'number' ? slot.data.panX : 0;
        state.panY = typeof slot.data.panY === 'number' ? slot.data.panY : 0;
        state.zoom = typeof slot.data.zoom === 'number' ? clamp(slot.data.zoom, 0.28, 2.4) : 1;
        state.currentSlotId = slot.id;
        state.currentBoardName = slot.name || '';

        clearSelection();
        renderAll();
        updateViewportTransform();
        saveWorkingStateNow();
        closeStorageModal();
        SoundEngine.play('spawn');
        showToast(`"${slot.name}" 스케치를 불러왔어요!`, '📂');
      }

      // 브라우저 보관함 항목 삭제
      function deleteSlotFromBrowser(slotId) {
        const slots = getSavedSlots();
        const target = slots.find(s => s.id === slotId);
        if (!target) return;

        showConfirm({
          title: '저장된 스케치를 삭제할까요?',
          desc: `"${target.name}" 항목이 브라우저 보관함에서 삭제됩니다.`,
          icon: '🗑️',
          okText: '삭제',
          onConfirm: () => {
            const next = getSavedSlots().filter(s => s.id !== slotId);
            persistSavedSlots(next);
            if (state.currentSlotId === slotId) {
              state.currentSlotId = null;
            }
            renderStorageSlotsList();
            SoundEngine.play('delete');
            showToast('보관함에서 삭제했어요', '🗑️');
          }
        });
      }

      // JSON 파일로 내보내기
      function exportBoardToFile() {
        try {
          const boardName = inferBoardName();
          const safeName = boardName.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '_').slice(0, 30) || 'sketch';
          const payload = {
            name: boardName,
            exportedAt: new Date().toISOString(),
            nodes: state.nodes,
            edges: state.edges,
            panX: state.panX,
            panY: state.panY,
            zoom: state.zoom
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `boingboard_${safeName}_${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          SoundEngine.play('boing');
          showToast('JSON 파일로 내보냈어요!', '📤');
        } catch (e) {
          showToast('파일 내보내기에 실패했어요', '⚠️');
        }
      }

      // 브라우저 보관함 모달 열기 / 닫기 / 목록 렌더링
      const storageModalEl = document.getElementById('storage-modal');
      const storageNameInputEl = document.getElementById('storage-name-input');
      const storageListEl = document.getElementById('storage-list');
      const storageCountBadgeEl = document.getElementById('storage-count-badge');

      function openStorageModal() {
        closeMorePopover();
        clearSelection();
        storageNameInputEl.value = inferBoardName();
        renderStorageSlotsList();
        storageModalEl.classList.remove('hidden');
        storageModalEl.classList.add('flex');
        SoundEngine.play('click');
      }

      function closeStorageModal() {
        storageModalEl.classList.add('hidden');
        storageModalEl.classList.remove('flex');
      }

      function renderStorageSlotsList() {
        const slots = getSavedSlots();
        storageCountBadgeEl.textContent = `${slots.length}개`;

        if (!slots.length) {
          storageListEl.innerHTML = `
            <div class="py-8 px-4 text-center rounded-2xl border border-dashed border-slate-300/80 bg-slate-50/50 ui-sans">
              <div class="text-2xl mb-1">✏️</div>
              <p class="text-xs font-bold text-slate-600">아직 브라우저에 저장된 스케치가 없어요</p>
              <p class="text-[11px] text-slate-400 mt-1">위에서 이름을 적고 저장 버튼을 눌러보세요!</p>
            </div>
          `;
          return;
        }

        storageListEl.innerHTML = slots.map(slot => {
          const isCurrent = slot.id === state.currentSlotId;
          return `
            <div class="p-2.5 rounded-2xl border ${isCurrent ? 'border-sky-400 bg-sky-50/50' : 'border-slate-300/70 bg-white/85'} flex items-center justify-between gap-2 ui-sans">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-bold text-slate-800 truncate">${escapeHtml(slot.name || '이름 없음')}</span>
                  ${isCurrent ? '<span class="shrink-0 px-1.5 py-0.5 rounded-full bg-sky-500 text-white text-[9px] font-bold">현재</span>' : ''}
                </div>
                <div class="text-[10px] text-slate-500 mt-0.5">
                  카드 ${slot.nodeCount ?? 0}개 · 선 ${slot.edgeCount ?? 0}개 · ${formatSavedTime(slot.updatedAt)}
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" data-slot-load="${slot.id}" class="sketch-btn px-2.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-[11px] font-bold">불러오기</button>
                <button type="button" data-slot-overwrite="${slot.id}" class="sketch-btn px-2 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 text-[11px] font-bold" title="현재 내용으로 덮어쓰기">덮어쓰기</button>
                <button type="button" data-slot-delete="${slot.id}" class="sketch-btn w-7 h-7 rounded-xl hover:bg-rose-100 text-slate-400 hover:text-rose-600 text-xs font-bold flex items-center justify-center" title="삭제">✕</button>
              </div>
            </div>
          `;
        }).join('');

        storageListEl.querySelectorAll('[data-slot-load]').forEach(btn => {
          btn.addEventListener('click', () => loadSlotFromBrowser(btn.dataset.slotLoad));
        });
        storageListEl.querySelectorAll('[data-slot-overwrite]').forEach(btn => {
          btn.addEventListener('click', () => {
            saveCurrentToBrowser({ overwriteSlotId: btn.dataset.slotOverwrite });
          });
        });
        storageListEl.querySelectorAll('[data-slot-delete]').forEach(btn => {
          btn.addEventListener('click', () => deleteSlotFromBrowser(btn.dataset.slotDelete));
        });
      }

      function pushUndo() {
        const snap = JSON.stringify({ nodes: state.nodes, edges: state.edges });
        if (undoStack.length && undoStack[undoStack.length - 1] === snap) return;
        undoStack.push(snap);
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        // 새로운 작업이 발생하면 다시 실행(Redo) 기록 초기화
        redoStack.length = 0;
        updateUndoButton();
      }

      function updateUndoButton() {
        const undoBtn = document.getElementById('btn-undo');
        if (undoBtn) undoBtn.disabled = undoStack.length === 0;
        const redoBtn = document.getElementById('btn-redo');
        if (redoBtn) redoBtn.disabled = redoStack.length === 0;
      }

      function performUndo() {
        if (!undoStack.length) return;
        try {
          const currentSnap = JSON.stringify({ nodes: state.nodes, edges: state.edges });
          redoStack.push(currentSnap);
          if (redoStack.length > MAX_UNDO) redoStack.shift();

          const prev = JSON.parse(undoStack.pop());
          state.nodes = prev.nodes || [];
          state.edges = prev.edges || [];
          state.selectedNodeId = null;
          state.editingNodeId = null;
          state.selectedEdgeId = null;
          renderAll();
          updateUndoButton();
          scheduleSave();
          SoundEngine.play('boing');
          showToast('이전 상태로 되돌렸어요', '↩️');
        } catch (e) {
          showToast('되돌리기에 실패했어요', '⚠️');
        }
      }

      function performRedo() {
        if (!redoStack.length) return;
        try {
          const currentSnap = JSON.stringify({ nodes: state.nodes, edges: state.edges });
          undoStack.push(currentSnap);
          if (undoStack.length > MAX_UNDO) undoStack.shift();

          const next = JSON.parse(redoStack.pop());
          state.nodes = next.nodes || [];
          state.edges = next.edges || [];
          state.selectedNodeId = null;
          state.editingNodeId = null;
          state.selectedEdgeId = null;
          renderAll();
          updateUndoButton();
          scheduleSave();
          SoundEngine.play('spawn');
          showToast('되돌린 내용을 다시 실행했어요', '↪️');
        } catch (e) {
          showToast('다시 실행에 실패했어요', '⚠️');
        }
      }

      /* -----------------------------------------------------------------------
         7. 뽀잉뽀잉 젤리 스프링 물리 엔진
         ----------------------------------------------------------------------- */
      function getPhys(id) {
        if (!nodePhysics.has(id)) {
          nodePhysics.set(id, {
            sx: 1, sy: 1, rot: 0,
            vsx: 0, vsy: 0, vrot: 0,
            targetSx: 1, targetSy: 1, targetRot: 0
          });
        }
        return nodePhysics.get(id);
      }

      function triggerNodeBoing(id, intensity = 1) {
        const p = getPhys(id);
        p.vsx += 0.23 * intensity;
        p.vsy -= 0.19 * intensity;
        p.vrot += (Math.random() > 0.5 ? 1 : -1) * 2.8 * intensity;
        ensurePhysicsLoop();
      }

      function ensurePhysicsLoop() {
        if (!physicsRafId) {
          physicsRafId = requestAnimationFrame(stepPhysics);
        }
      }

      function stepPhysics() {
        let active = false;
        const stiffness = 0.23;
        const damping = 0.72;

        for (const [id, p] of nodePhysics.entries()) {
          const el = nodeElements.get(id);
          const node = state.nodes.find(n => n.id === id);
          if (!el || !node) continue;

          p.vsx = (p.vsx + (p.targetSx - p.sx) * stiffness) * damping;
          p.vsy = (p.vsy + (p.targetSy - p.sy) * stiffness) * damping;
          p.vrot = (p.vrot + (p.targetRot - p.rot) * stiffness) * damping;

          p.sx += p.vsx;
          p.sy += p.vsy;
          p.rot += p.vrot;

          const settled =
            Math.abs(p.targetSx - p.sx) < 0.0015 &&
            Math.abs(p.targetSy - p.sy) < 0.0015 &&
            Math.abs(p.targetRot - p.rot) < 0.05 &&
            Math.abs(p.vsx) < 0.0015 &&
            Math.abs(p.vsy) < 0.0015 &&
            Math.abs(p.vrot) < 0.05;

          if (settled) {
            p.sx = p.targetSx;
            p.sy = p.targetSy;
            p.rot = p.targetRot;
            p.vsx = p.vsy = p.vrot = 0;
          } else {
            active = true;
          }

          el.style.transform = `translate3d(${node.x}px, ${node.y}px, 0) scale(${p.sx.toFixed(4)}, ${p.sy.toFixed(4)}) rotate(${p.rot.toFixed(2)}deg)`;
        }

        if (active) {
          physicsRafId = requestAnimationFrame(stepPhysics);
        } else {
          physicsRafId = null;
        }
      }

      /* -----------------------------------------------------------------------
         8. 뷰포트 변환 & 연한 모눈종이 격자 동기화
         ----------------------------------------------------------------------- */
      function updateViewportTransform() {
        worldEl.style.transform = `translate3d(${state.panX}px, ${state.panY}px, 0) scale(${state.zoom})`;

        const major = 120 * state.zoom;
        const minor = 24 * state.zoom;
        viewportEl.style.backgroundSize = `${major}px ${major}px, ${major}px ${major}px, ${minor}px ${minor}px, ${minor}px ${minor}px`;
        viewportEl.style.backgroundPosition = `${state.panX}px ${state.panY}px`;

        updateSelectedEdgeButton();
      }

      function zoomAt(clientX, clientY, newZoom) {
        const clamped = clamp(newZoom, 0.28, 2.4);
        const worldPos = screenToWorld(clientX, clientY);
        state.zoom = clamped;
        state.panX = clientX - worldPos.x * state.zoom;
        state.panY = clientY - worldPos.y * state.zoom;
        updateViewportTransform();
        scheduleSave();
      }

      function fitView(animate = true) {
        if (!state.nodes.length) {
          state.panX = window.innerWidth / 2;
          state.panY = window.innerHeight / 2;
          state.zoom = 1;
          updateViewportTransform();
          return;
        }

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        state.nodes.forEach(n => {
          const el = nodeElements.get(n.id);
          const w = el ? el.offsetWidth : (n.width || 240);
          const h = el ? el.offsetHeight : 120;
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x + w);
          maxY = Math.max(maxY, n.y + h);
        });

        const padding = window.innerWidth < 640 ? 44 : 88;
        const contentW = Math.max(100, maxX - minX);
        const contentH = Math.max(100, maxY - minY);
        const availW = Math.max(200, window.innerWidth - padding * 2);
        const availH = Math.max(200, window.innerHeight - padding * 2);

        const targetZoom = clamp(Math.min(availW / contentW, availH / contentH), 0.42, 1.15);
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        const targetPanX = window.innerWidth / 2 - cx * targetZoom;
        const targetPanY = window.innerHeight / 2 - cy * targetZoom;

        if (!animate) {
          state.zoom = targetZoom;
          state.panX = targetPanX;
          state.panY = targetPanY;
          updateViewportTransform();
          return;
        }

        const startX = state.panX, startY = state.panY, startZ = state.zoom;
        const startTime = performance.now();
        const duration = 360;

        function anim(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const ease = 1 - Math.pow(1 - t, 3);
          state.panX = startX + (targetPanX - startX) * ease;
          state.panY = startY + (targetPanY - startY) * ease;
          state.zoom = startZ + (targetZoom - startZ) * ease;
          updateViewportTransform();
          if (t < 1) requestAnimationFrame(anim);
          else scheduleSave();
        }
        requestAnimationFrame(anim);
      }

      /* -----------------------------------------------------------------------
         9. 노드 생성 & 스마트 타입 전환 (메모 ↔ 말풍선 ↔ 표 ↔ 그래프)
         ----------------------------------------------------------------------- */
      function createNodeData(type, x, y, overrides = {}) {
        const base = {
          id: genId('n'),
          seed: genSeed(),
          type,
          x: Math.round(x),
          y: Math.round(y),
          width: type === 'mindmap' ? 195 : type === 'table' ? 295 : type === 'chart' ? 305 : 235,
          color: type === 'memo' ? 'lemon' : type === 'mindmap' ? 'sky' : type === 'table' ? 'mint' : 'lavender',
          title: '',
          content: '',
          ...overrides
        };

        if (type === 'table' && !base.tableData) {
          base.tableData = {
            headers: ['항목', '수치', '메모'],
            rows: [
              ['월', '32', '좋음'],
              ['화', '48', '상승'],
              ['수', '41', '유지']
            ]
          };
        }
        if (type === 'chart' && !base.chartData) {
          base.chartData = {
            chartType: 'bar',
            editing: false,
            items: [
              { label: '기획', value: 35 },
              { label: '스케치', value: 58 },
              { label: '완성', value: 76 }
            ]
          };
        }
        return base;
      }

      function addNode(type, worldX, worldY, overrides = {}, parentId = null, autoEdit = false) {
        pushUndo();
        const node = createNodeData(type, worldX, worldY, overrides);
        state.nodes.push(node);

        if (parentId) {
          state.edges.push({ id: genId('e'), from: parentId, to: node.id, seed: genSeed() });
        }

        const el = renderNode(node, true);
        renderEdges();
        selectNode(node.id, autoEdit);
        SoundEngine.play('spawn');
        scheduleSave();

        if (autoEdit) {
          const focusTarget = el.querySelector('.memo-textarea') || el.querySelector('.node-title-input');
          if (focusTarget) {
            // 클릭/탭 제스처 흐름 안에서 즉시 포커스하여 모바일 키보드도 자연스럽게 열림
            focusTarget.focus();
          }
        }
        return node;
      }

      // 노드 설정에서 타입을 바꿀 때 기존 내용을 알잘딱하게 자동 변환!
      function switchNodeType(node, newType) {
        if (node.type === newType) return;
        pushUndo();

        const oldType = node.type;
        const oldW = node.width || 235;

        // 1) 메모/말풍선 -> 표
        if (newType === 'table') {
          if (oldType === 'chart' && node.chartData?.items?.length) {
            node.tableData = {
              headers: ['항목', '수치'],
              rows: node.chartData.items.map(it => [String(it.label ?? ''), String(it.value ?? 0)])
            };
          } else if ((oldType === 'memo' || oldType === 'mindmap') && node.content?.trim()) {
            const lines = node.content.trim().split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const parsed = lines.map(line => {
              if (line.includes('\t')) return line.split('\t').map(s => s.trim());
              if (line.includes(',')) return line.split(',').map(s => s.trim());
              if (line.includes(':')) return line.split(':').map(s => s.trim());
              const m = line.match(/^(.+?)\s+(-?\d+(?:\.\d+)?)$/);
              if (m) return [m[1].trim(), m[2]];
              return [line, ''];
            });
            const colCount = Math.max(2, ...parsed.map(r => r.length));
            node.tableData = {
              headers: Array.from({ length: colCount }, (_, i) => i === 0 ? '항목' : i === 1 ? '값' : `메모${i - 1}`),
              rows: parsed.map(r => Array.from({ length: colCount }, (_, i) => r[i] ?? ''))
            };
          } else if (!node.tableData) {
            node.tableData = {
              headers: ['항목', '수치', '메모'],
              rows: [['항목 1', '30', ''], ['항목 2', '55', ''], ['항목 3', '42', '']]
            };
          }
          if (!node.title) node.title = '손그림 표';
          node.width = Math.max(285, oldW);
        }

        // 2) 메모/말풍선/표 -> 그래프
        else if (newType === 'chart') {
          let extracted = [];
          if (oldType === 'table' && node.tableData?.rows?.length) {
            extracted = extractChartItemsFromTable(node.tableData);
          } else if ((oldType === 'memo' || oldType === 'mindmap') && node.content?.trim()) {
            const lines = node.content.trim().split(/\r?\n/);
            lines.forEach((line, idx) => {
              const m = line.match(/^([^0-9,:\t-]+)?[,:\s\t-]*(-?\d+(?:\.\d+)?)/);
              if (m) {
                const label = (m[1] || `항목 ${idx + 1}`).replace(/^[•\-\*]\s*/, '').trim() || `항목 ${idx + 1}`;
                extracted.push({ label, value: parseFloat(m[2]) || 0 });
              }
            });
          }

          if (extracted.length > 0) {
            node.chartData = {
              chartType: node.chartData?.chartType || 'bar',
              editing: false,
              items: extracted
            };
          } else if (!node.chartData) {
            node.chartData = {
              chartType: 'bar',
              editing: false,
              items: [
                { label: '항목 A', value: 35 },
                { label: '항목 B', value: 62 },
                { label: '항목 C', value: 48 }
              ]
            };
          }
          if (!node.title) node.title = '손그림 그래프';
          node.width = Math.max(295, oldW);
        }

        // 3) 표/그래프 -> 메모
        else if (newType === 'memo') {
          if (!node.content?.trim()) {
            if (oldType === 'table' && node.tableData?.rows?.length) {
              node.content = node.tableData.rows.map(r => r.filter(Boolean).join(' : ')).join('\n');
            } else if (oldType === 'chart' && node.chartData?.items?.length) {
              node.content = node.chartData.items.map(it => `${it.label} ${it.value}`).join('\n');
            }
          }
          node.width = clamp(oldW, 215, 320);
        }

        // 4) 어떤 노드든 -> 말풍선(마인드맵 키워드)
        else if (newType === 'mindmap') {
          if (!node.title && node.content?.trim()) {
            node.title = node.content.trim().split(/\r?\n/)[0].slice(0, 24);
          }
          node.width = clamp(oldW, 180, 240);
        }

        // 중심 위치가 어긋나지 않게 미세 보정
        node.x = Math.round(node.x - (node.width - oldW) / 2);
        node.height = null;
        node.type = newType;
        state.editingNodeId = null;

        rerenderSingleNode(node);
        triggerNodeBoing(node.id, 1.05);
        SoundEngine.play('boing');
        scheduleSave();

        const typeLabel = { memo: '메모', mindmap: '말풍선', table: '표', chart: '그래프' }[newType];
        showToast(`${typeLabel} 모양으로 뽀잉! 바꿨어요`, '✨');
      }

      function extractChartItemsFromTable(td) {
        let valueCol = 1;
        let bestCount = -1;
        for (let c = 1; c < td.headers.length; c++) {
          let cnt = 0;
          td.rows.forEach(r => {
            const num = parseFloat(String(r[c] || '').replace(/[^0-9.-]/g, ''));
            if (!isNaN(num)) cnt++;
          });
          if (cnt > bestCount) {
            bestCount = cnt;
            valueCol = c;
          }
        }
        return td.rows.map((r, i) => {
          const label = String(r[0] || `항목 ${i + 1}`).trim();
          const num = parseFloat(String(r[valueCol] || '0').replace(/[^0-9.-]/g, ''));
          return { label, value: isNaN(num) ? 0 : num };
        });
      }

      function findSmartChildPosition(parentNode, preferredSide = 'right') {
        const pEl = nodeElements.get(parentNode.id);
        const pw = pEl ? pEl.offsetWidth : (parentNode.width || 220);
        const ph = pEl ? pEl.offsetHeight : 90;

        const existingChildren = state.edges
          .filter(e => e.from === parentNode.id)
          .map(e => state.nodes.find(n => n.id === e.to))
          .filter(Boolean);

        const idx = existingChildren.length;
        if (preferredSide === 'bottom') {
          return {
            x: parentNode.x + (idx % 2 === 0 ? 1 : -1) * Math.ceil(idx / 2) * 165,
            y: parentNode.y + ph + 86
          };
        }
        const spreadY = idx === 0 ? 0 : (idx % 2 === 1 ? -1 : 1) * Math.ceil(idx / 2) * 120;
        return {
          x: parentNode.x + pw + 94,
          y: parentNode.y + spreadY
        };
      }

      /* -----------------------------------------------------------------------
         10. 손그림 SVG 테두리 실시간 업데이트
         ----------------------------------------------------------------------- */
      function updateNodeSketch(node, wrapper) {
        const card = wrapper.querySelector('.node-card');
        const svg = wrapper.querySelector('.sketch-bg-svg');
        if (!card || !svg) return;

        const w = Math.max(60, card.offsetWidth);
        const h = Math.max(44, card.offsetHeight);
        const theme = COLOR_THEMES[node.color] || COLOR_THEMES.paper;
        const seed = node.seed || 12345;

        const paths = node.type === 'mindmap'
          ? Sketch.bubblePaths(w, h, seed)
          : Sketch.rectPaths(w, h, seed, 1.75);

        svg.setAttribute('viewBox', `0 0 ${w + 12} ${h + 12}`);
        svg.innerHTML = `
          <!-- 종이 위 부드러운 손그림 그림자 -->
          <path d="${paths.fillPath}" transform="translate(3.5, 4.2)" fill="rgba(44, 52, 64, 0.085)" />
          <!-- 따뜻한 마커/종이 채우기 -->
          <path d="${paths.fillPath}" fill="${theme.fill}" />
          <!-- 1차 펜 외곽선 -->
          <path d="${paths.stroke1}" fill="none" stroke="${theme.stroke}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
          <!-- 2차 덧그린 펜선 (진짜 손그림 감성!) -->
          <path d="${paths.stroke2}" fill="none" stroke="${theme.stroke}" stroke-width="1.15" stroke-opacity="0.58" stroke-linecap="round" stroke-linejoin="round" />
        `;
      }

      /* -----------------------------------------------------------------------
         11. 노드 렌더링 (메모 / 말풍선 / 표 / 그래프)
         ----------------------------------------------------------------------- */
      function renderAll() {
        nodesLayerEl.innerHTML = '';
        nodeElements.clear();
        nodePhysics.clear();

        state.nodes.forEach(node => renderNode(node, false));
        renderEdges();
        updateSelectionUI();
      }

      // 노드의 가로·세로 크기와 내부 입력칸 높이를 동기화
      function applyNodeSize(node, wrapper) {
        if (!wrapper) return;
        wrapper.style.width = `${node.width || 235}px`;
        const card = wrapper.querySelector('.node-card');
        if (!card) return;

        const hasCustomHeight = typeof node.height === 'number' && node.height > 0;
        card.classList.toggle('has-custom-height', hasCustomHeight);

        if (hasCustomHeight) {
          if (node.type === 'chart' && node.chartData?.editing) {
            card.style.height = 'auto';
            card.style.minHeight = `${node.height}px`;
          } else {
            card.style.height = `${node.height}px`;
            card.style.minHeight = '';
          }
        } else {
          card.style.height = '';
          card.style.minHeight = '';
        }

        if (node.type === 'memo') {
          const ta = wrapper.querySelector('.memo-textarea');
          if (ta) {
            if (hasCustomHeight) {
              ta.style.height = '';
            } else {
              ta.style.height = 'auto';
              ta.style.height = Math.min(280, Math.max(54, ta.scrollHeight)) + 'px';
            }
          }
        }
      }

      function renderNode(node, isNew = false) {
        if (!node.seed) node.seed = genSeed();
        const theme = COLOR_THEMES[node.color] || COLOR_THEMES.paper;

        const wrapper = document.createElement('div');
        wrapper.className = 'node-wrapper group';
        wrapper.dataset.id = node.id;
        wrapper.style.width = `${node.width || 235}px`;
        wrapper.style.transform = `translate3d(${node.x}px, ${node.y}px, 0)`;

        const typeButtons = [
          { key: 'memo',    label: '메모',  icon: '✏️' },
          { key: 'mindmap', label: '말풍선', icon: '🫧' },
          { key: 'table',   label: '표',    icon: '📋' },
          { key: 'chart',   label: '그래프', icon: '📊' }
        ];

        wrapper.innerHTML = `
          <!-- 선택 시 떠오르는 노드 설정 바 (여기서 메모/말풍선/표/그래프 자유 전환!) -->

            <!-- 1줄: 노드 타입 전환 -->

              ${typeButtons.map(tb => `
                <button type="button" data-switch-type="${tb.key}" class="sketch-btn px-2 py-0.5 rounded-full text-[11px] font-bold flex items-center gap-0.5 ${node.type === tb.key ? 'bg-[#2c3440] text-white' : 'text-slate-600 hover:bg-amber-100/70'}">
                  <span>${tb.icon}</span><span>${tb.label}</span>

              `).join('')}
            </div>
            <!-- 2줄: 마커 색상 & 가지/복제/삭제 -->
            <div class="flex items-center gap-1.5 pt-0.5 border-t border-slate-200/80 w-full justify-center">
              <div class="flex items-center gap-1 pr-1.5 border-r border-slate-200/90">
                ${Object.entries(COLOR_THEMES).map(([key, t]) => `
                  <button type="button" data-color="${key}" class="sketch-btn w-4 h-4 rounded-full border-[1.5px] border-slate-500/50 ${node.color === key ? 'ring-2 ring-sky-400 scale-110' : ''}" style="background:${t.dot}" title="형광펜 색상"></button>
                `).join('')}
              </div>
              <button type="button" data-action="branch" class="sketch-btn ui-sans px-1.5 py-0.5 rounded-full text-[11px] font-bold text-sky-700 hover:bg-sky-50" title="연결된 새 메모 추가">+가지</button>
              <button type="button" data-action="duplicate" class="sketch-btn p-1 rounded-full text-slate-500 hover:bg-slate-100" title="복제">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              </button>
              <button type="button" data-action="delete" class="sketch-btn p-1 rounded-full text-rose-500 hover:bg-rose-50" title="삭제">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          </div>

          <!-- 손그림 카드 본체 -->
          <div class="node-card ${isNew ? 'animate-boing-spawn' : ''}">
            <svg class="sketch-bg-svg"></svg>

            <!-- 우측 하단 가로·세로 크기 조절 핸들 (더블클릭 시 세로 자동 맞춤) -->

              <svg class="w-3.5 h-3.5" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12L12 3M7.5 12L12 7.5"/></svg>
            </div>

        // 저장된 가로·세로 크기 반영 후 손그림 외곽선 그리기
        applyNodeSize(node, wrapper);
        updateNodeSketch(node, wrapper);
        if (nodeResizeObserver) {
          nodeResizeObserver.observe(wrapper.querySelector('.node-card'));
