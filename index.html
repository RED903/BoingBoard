      function populateNodeBody(node, bodyEl, theme) {
        if (node.type === 'mindmap') {
          bodyEl.innerHTML = `
            <div class="px-5 py-3.5 text-center flex-1 flex items-center justify-center min-h-0">
              <input type="text" class="node-title-input edit-field w-full bg-transparent text-center text-xl font-bold focus:outline-none placeholder:text-slate-400/80" style="color:${theme.text}" value="${escapeHtml(node.title)}" placeholder="핵심 키워드..." />
            </div>
          `;
          const inp = bodyEl.querySelector('.node-title-input');
          inp.addEventListener('input', () => {
            node.title = inp.value;
            scheduleSave();
          });
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
              e.preventDefault();
              const pos = findSmartChildPosition(node, 'right');
              addNode('mindmap', pos.x, pos.y, { color: node.color }, node.id, true);
            }
          });
        }

        else if (node.type === 'memo') {
          bodyEl.innerHTML = `
            <div class="px-4 py-3 flex flex-col flex-1 min-h-0">
              <input type="text" class="node-title-input edit-field shrink-0 w-full bg-transparent text-lg font-bold focus:outline-none placeholder:text-slate-400/70 mb-0.5" style="color:${theme.text}" value="${escapeHtml(node.title)}" placeholder="제목 (선택)" />
              <div class="shrink-0 w-full h-[1.5px] mb-1.5 opacity-25" style="background: repeating-linear-gradient(to right, ${theme.stroke} 0 5px, transparent 5px 9px);"></div>
              <textarea rows="2" class="memo-textarea edit-field thin-scroll w-full flex-1 min-h-[36px] bg-transparent text-[17px] leading-[1.38] focus:outline-none resize-none placeholder:text-slate-400/80" style="color:${theme.text}" placeholder="여기에 쓱쓱 메모하세요...">${escapeHtml(node.content)}</textarea>
            </div>
          `;
          const titleInp = bodyEl.querySelector('.node-title-input');
          const ta = bodyEl.querySelector('.memo-textarea');

          const autoResize = () => {
            if (typeof node.height === 'number' && node.height > 0) {
              ta.style.height = '';
              return;
            }
            ta.style.height = 'auto';
            ta.style.height = Math.min(280, Math.max(54, ta.scrollHeight)) + 'px';
            const wrapper = nodeElements.get(node.id);
            if (wrapper) updateNodeSketch(node, wrapper);
            renderEdges();
          };
          setTimeout(autoResize, 0);

          titleInp.addEventListener('input', () => { node.title = titleInp.value; scheduleSave(); });
          ta.addEventListener('input', () => { node.content = ta.value; autoResize(); scheduleSave(); });
        }

        else if (node.type === 'table') {
          renderTableBody(node, bodyEl, theme);
        }

        else if (node.type === 'chart') {
          renderChartBody(node, bodyEl, theme);
        }
      }

      /* -----------------------------------------------------------------------
         12. 손그림 표(Table) 컴포넌트
         ----------------------------------------------------------------------- */
      function renderTableBody(node, bodyEl, theme) {
        const td = node.tableData || { headers: ['항목', '수치'], rows: [['항목 1', '10']] };
        node.tableData = td;

        bodyEl.innerHTML = `
          <div class="p-3.5 flex flex-col flex-1 min-h-0">
            <div class="flex items-center justify-between gap-2 mb-2 shrink-0">
              <input type="text" class="node-title-input edit-field w-full bg-transparent text-lg font-bold focus:outline-none truncate" style="color:${theme.text}" value="${escapeHtml(node.title)}" placeholder="표 제목" />
              <button type="button" class="btn-spawn-chart sketch-btn ui-sans shrink-0 px-2 py-0.5 rounded-full text-[11px] font-bold bg-[#fffef9] border-[1.5px] border-slate-600/60 text-violet-700 hover:bg-violet-50" title="옆에 그래프 노드 추가">
                📊 그래프 뽑기
              </button>
            </div>

            <div class="flex-1 min-h-0 overflow-auto thin-scroll rounded-xl border-[1.6px] border-slate-700/55 bg-[#fffef9]/75">
              <table class="sketch-table w-full text-[15px] border-collapse">
                <thead>
                  <tr class="border-b-[1.6px] border-slate-700/55" style="background:${theme.soft}">
                    ${td.headers.map((h, ci) => `
                      <th class="p-0 border-r last:border-r-0">
                        <input type="text" data-hcol="${ci}" class="edit-field w-full min-w-[54px] px-2 py-1 bg-transparent font-bold text-center focus:outline-none focus:bg-white/70" style="color:${theme.text}" value="${escapeHtml(h)}" />
                      </th>
                    `).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${td.rows.map((row, ri) => `
                    <tr class="border-b border-dashed last:border-b-0">
                      ${td.headers.map((_, ci) => `
                        <td class="p-0 border-r border-dashed last:border-r-0">
                          <input type="text" data-row="${ri}" data-col="${ci}" class="edit-field w-full min-w-[54px] px-2 py-1 bg-transparent text-center focus:outline-none focus:bg-white/70" style="color:${theme.text}" value="${escapeHtml(row[ci] ?? '')}" />
                        </td>
                      `).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div class="flex items-center justify-between mt-2 ui-sans text-[11px] text-slate-600 shrink-0">
              <div class="flex items-center gap-1">
                <button type="button" class="btn-add-row sketch-btn px-2 py-0.5 rounded-full bg-[#fffef9] border border-slate-400/70 font-semibold">+행</button>
                <button type="button" class="btn-add-col sketch-btn px-2 py-0.5 rounded-full bg-[#fffef9] border border-slate-400/70 font-semibold">+열</button>
              </div>
              <div class="flex items-center gap-1">
                <button type="button" class="btn-del-row sketch-btn px-2 py-0.5 rounded-full hover:bg-rose-50 hover:text-rose-600 font-semibold">-행</button>
                <button type="button" class="btn-del-col sketch-btn px-2 py-0.5 rounded-full hover:bg-rose-50 hover:text-rose-600 font-semibold">-열</button>
              </div>
            </div>
          </div>
        `;

        bodyEl.querySelector('.node-title-input').addEventListener('input', (e) => {
          node.title = e.target.value;
          scheduleSave();
        });

        bodyEl.querySelectorAll('input[data-hcol]').forEach(inp => {
          inp.addEventListener('input', () => {
            td.headers[Number(inp.dataset.hcol)] = inp.value;
            scheduleSave();
          });
        });

        bodyEl.querySelectorAll('input[data-row]').forEach(inp => {
          inp.addEventListener('input', () => {
            td.rows[Number(inp.dataset.row)][Number(inp.dataset.col)] = inp.value;
            scheduleSave();
          });

          // 엑셀/시트 붙여넣기 자동 확장
          inp.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text || (!text.includes('\t') && !text.includes('\n'))) return;
            e.preventDefault();
            pushUndo();
            const startR = Number(inp.dataset.row);
            const startC = Number(inp.dataset.col);
            const lines = text.trim().split(/\r?\n/).map(l => l.split('\t'));
            lines.forEach((cols, dr) => {
              const rIdx = startR + dr;
              while (td.rows.length <= rIdx) td.rows.push(new Array(td.headers.length).fill(''));
              cols.forEach((val, dc) => {
                const cIdx = startC + dc;
                while (td.headers.length <= cIdx) {
                  td.headers.push(`열 ${td.headers.length + 1}`);
                  td.rows.forEach(r => r.push(''));
                }
                td.rows[rIdx][cIdx] = val.trim();
              });
            });
            renderTableBody(node, bodyEl, theme);
            const wrapper = nodeElements.get(node.id);
            if (wrapper) updateNodeSketch(node, wrapper);
            triggerNodeBoing(node.id, 0.75);
            SoundEngine.play('boing');
            scheduleSave();
            showToast('표 내용을 깔끔하게 붙여넣었어요!', '📋');
          });
        });

        const refreshTable = () => {
          renderTableBody(node, bodyEl, theme);
          const wrapper = nodeElements.get(node.id);
          if (wrapper) updateNodeSketch(node, wrapper);
          renderEdges();
          scheduleSave();
        };

        bodyEl.querySelector('.btn-add-row').addEventListener('click', (e) => {
          e.stopPropagation();
          pushUndo();
          td.rows.push(td.headers.map((_, i) => i === 0 ? `항목 ${td.rows.length + 1}` : '0'));
          refreshTable();
          triggerNodeBoing(node.id, 0.65);
          SoundEngine.play('click');
        });

        bodyEl.querySelector('.btn-add-col').addEventListener('click', (e) => {
          e.stopPropagation();
          pushUndo();
          td.headers.push(`열 ${td.headers.length + 1}`);
          td.rows.forEach(r => r.push(''));
          refreshTable();
          triggerNodeBoing(node.id, 0.65);
          SoundEngine.play('click');
        });

        bodyEl.querySelector('.btn-del-row').addEventListener('click', (e) => {
          e.stopPropagation();
          if (td.rows.length <= 1) return showToast('최소 1개 행은 필요해요', '📋');
          pushUndo();
          td.rows.pop();
          refreshTable();
          SoundEngine.play('delete');
        });

        bodyEl.querySelector('.btn-del-col').addEventListener('click', (e) => {
          e.stopPropagation();
          if (td.headers.length <= 1) return showToast('최소 1개 열은 필요해요', '📋');
          pushUndo();
          td.headers.pop();
          td.rows.forEach(r => r.pop());
          refreshTable();
          SoundEngine.play('delete');
        });

        // 표에서 별도 그래프 카드 바로 생성
        bodyEl.querySelector('.btn-spawn-chart').addEventListener('click', (e) => {
          e.stopPropagation();
          const items = extractChartItemsFromTable(td);
          const pos = findSmartChildPosition(node, 'right');
          addNode('chart', pos.x, pos.y, {
            title: `${node.title || '표'} 그래프`,
            color: 'lavender',
            chartData: { chartType: 'bar', editing: false, items }
          }, node.id, false);
          showToast('표로 손그림 그래프를 뚝딱 그렸어요!', '📊');
        });
      }

      /* -----------------------------------------------------------------------
         13. 손그림 그래프(Chart) SVG 렌더링 (막대 · 꺾은선 · 원형 + 펜 빗금 질감)
         ----------------------------------------------------------------------- */
      function buildSketchChartSvg(node) {
        const cd = node.chartData;
        const items = (cd.items || []).filter(Boolean);
        if (!items.length) {
          return `<div class="h-36 flex items-center justify-center text-sm text-slate-400">항목을 추가해 주세요</div>`;
        }

        const W = 276;
        const H = 158;
        const rng = mulberry32((node.seed || 100) + 911);
        const patId = `hatch_${node.id}`;

        // 공통 펜 빗금 패턴 (마커로 쓱쓱 칠한 질감)
        const hatchDef = `
          <defs>
            <pattern id="${patId}" width="6" height="6" patternTransform="rotate(38 0 0)" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(44,52,64,0.18)" stroke-width="1.4" />
            </pattern>
          </defs>
        `;

        // 1) 손그림 막대 그래프
        if (cd.chartType === 'bar') {
          const maxVal = Math.max(1, ...items.map(i => Math.max(0, Number(i.value) || 0)));
          const padL = 18, padR = 14, padT = 24, padB = 28;
          const chartW = W - padL - padR;
          const chartH = H - padT - padB;
          const slotW = chartW / items.length;
          const barW = Math.min(34, Math.max(14, slotW * 0.56));

          // 손그림 X축 & Y축
          const yAxis = Sketch.line(padL, padT - 6, padL, H - padB + 2, rng, 1.1);
          const xAxis = Sketch.line(padL - 3, H - padB, W - padR + 4, H - padB, rng, 1.2);

          const bars = items.map((item, i) => {
            const val = Math.max(0, Number(item.value) || 0);
            const bh = Math.max(4, (val / maxVal) * chartH);
            const cx = padL + slotW * i + slotW / 2;
            const x = cx - barW / 2;
            const y = padT + chartH - bh;
            const color = CHART_PALETTE[i % CHART_PALETTE.length];
            const label = String(item.label || '').slice(0, 6);

            // 막대 자체도 손으로 그린 살짝 삐뚤한 네모!
            const j = () => (rng() - 0.5) * 2.2;
            const d = `M ${(x + j()).toFixed(1)} ${(y + j()).toFixed(1)} L ${(x + barW + j()).toFixed(1)} ${(y + j()).toFixed(1)} L ${(x + barW + j()).toFixed(1)} ${(H - padB).toFixed(1)} L ${(x + j()).toFixed(1)} ${(H - padB).toFixed(1)} Z`;

            return `
              <g class="chart-bar-g">
                <path d="${d}" fill="${color}" fill-opacity="0.72" />
                <path d="${d}" fill="url(#${patId})" />
                <path d="${d}" fill="none" stroke="#3a4250" stroke-width="1.7" stroke-linejoin="round" />
                <text x="${cx.toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3440">${val}</text>
                <text x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="13" font-weight="700" fill="#525e6e">${escapeHtml(label)}</text>
              </g>
            `;
          }).join('');

          return `
            <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto overflow-visible">
              ${hatchDef}
              <path d="${yAxis}" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
              <path d="${xAxis}" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
              ${bars}
            </svg>
          `;
        }

        // 2) 손그림 꺾은선 그래프
        if (cd.chartType === 'line') {
          const vals = items.map(i => Number(i.value) || 0);
          const maxVal = Math.max(1, ...vals);
          const minVal = Math.min(0, ...vals);
          const range = Math.max(1, maxVal - minVal);
          const padL = 22, padR = 20, padT = 24, padB = 28;
          const chartW = W - padL - padR;
          const chartH = H - padT - padB;

          const yAxis = Sketch.line(padL - 6, padT - 6, padL - 6, H - padB + 2, rng, 1.1);
          const xAxis = Sketch.line(padL - 8, H - padB, W - padR + 6, H - padB, rng, 1.2);

          const pts = items.map((item, i) => ({
            x: items.length === 1 ? W / 2 : padL + (chartW / (items.length - 1)) * i,
            y: padT + chartH - (((Number(item.value) || 0) - minVal) / range) * chartH,
            item
          }));

          let segs = '';
          for (let i = 0; i < pts.length - 1; i++) {
            const p1 = pts[i], p2 = pts[i + 1];
            segs += `<path d="${Sketch.line(p1.x, p1.y, p2.x, p2.y, rng, 1.4)}" fill="none" stroke="#7c3aed" stroke-width="2.6" stroke-linecap="round" />`;
          }

          const dots = pts.map(p => `
            <g>
              <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.6" fill="#fffef9" stroke="#3a4250" stroke-width="2.1" />
              <text x="${p.x.toFixed(1)}" y="${(p.y - 9).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">${p.item.value}</text>
              <text x="${p.x.toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="13" font-weight="700" fill="#525e6e">${escapeHtml(String(p.item.label || '').slice(0, 6))}</text>
            </g>
          `).join('');

          return `
            <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto overflow-visible">
              <path d="${yAxis}" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
              <path d="${xAxis}" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
              ${segs}
              ${dots}
            </svg>
          `;
        }

        // 3) 손그림 원형 도넛 그래프
        const positives = items.map(i => ({ label: i.label, value: Math.max(0, Number(i.value) || 0) }));
        const total = positives.reduce((acc, cur) => acc + cur.value, 0);
        const cx = 78, cy = 79, r = 54, ir = 24;

        let slicesSvg = '';
        if (total <= 0) {
          slicesSvg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e2e8f0" stroke="#3a4250" stroke-width="1.8" /><circle cx="${cx}" cy="${cy}" r="${ir}" fill="#fffef9" stroke="#3a4250" stroke-width="1.6" />`;
        } else if (positives.filter(p => p.value > 0).length === 1) {
          const idx = positives.findIndex(p => p.value > 0);
          slicesSvg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${CHART_PALETTE[idx % CHART_PALETTE.length]}" fill-opacity="0.78" stroke="#3a4250" stroke-width="1.8" /><circle cx="${cx}" cy="${cy}" r="${ir}" fill="#fffef9" stroke="#3a4250" stroke-width="1.6" />`;
        } else {
          let angle = -Math.PI / 2;
          slicesSvg = positives.map((item, i) => {
            if (item.value <= 0) return '';
            const sliceAngle = (item.value / total) * Math.PI * 2;
            const endAngle = angle + sliceAngle;
            const largeArc = sliceAngle > Math.PI ? 1 : 0;

            const x1 = cx + r * Math.cos(angle);
            const y1 = cy + r * Math.sin(angle);
            const x2 = cx + r * Math.cos(endAngle);
            const y2 = cy + r * Math.sin(endAngle);
            const ix1 = cx + ir * Math.cos(endAngle);
            const iy1 = cy + ir * Math.sin(endAngle);
            const ix2 = cx + ir * Math.cos(angle);
            const iy2 = cy + ir * Math.sin(angle);

            angle = endAngle;
            const d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L ${ix1.toFixed(1)} ${iy1.toFixed(1)} A ${ir} ${ir} 0 ${largeArc} 0 ${ix2.toFixed(1)} ${iy2.toFixed(1)} Z`;
            return `
              <path d="${d}" fill="${CHART_PALETTE[i % CHART_PALETTE.length]}" fill-opacity="0.74" />
              <path d="${d}" fill="url(#${patId})" />
              <path d="${d}" fill="none" stroke="#3a4250" stroke-width="1.6" stroke-linejoin="round" />
            `;
          }).join('');
        }

        const legend = positives.slice(0, 5).map((item, i) => {
          const pct = total > 0 ? Math.round((item.value / total) * 100) : 0;
          const y = 29 + i * 24;
          return `
            <g>
              <rect x="148" y="${y - 10}" width="11" height="11" rx="3" fill="${CHART_PALETTE[i % CHART_PALETTE.length]}" fill-opacity="0.82" stroke="#3a4250" stroke-width="1.3" />
              <text x="164" y="${y}" font-size="13.5" font-weight="700" fill="#2c3440">${escapeHtml(String(item.label || '').slice(0, 6))}</text>
              <text x="270" y="${y}" text-anchor="end" font-size="13.5" font-weight="700" fill="#525e6e">${pct}%</text>
            </g>
          `;
        }).join('');

        return `
          <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">
            ${hatchDef}
            ${slicesSvg}
            <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3440">${total}</text>
            ${legend}
          </svg>
        `;
      }

      function renderChartBody(node, bodyEl, theme) {
        const cd = node.chartData || { chartType: 'bar', editing: false, items: [{ label: 'A', value: 30 }] };
        node.chartData = cd;

        const types = [
          { key: 'bar', label: '막대' },
          { key: 'line', label: '선' },
          { key: 'pie', label: '원형' }
        ];

        bodyEl.innerHTML = `
          <div class="p-3.5 flex flex-col flex-1 min-h-0">
            <div class="flex items-center justify-between gap-2 mb-2 shrink-0">
              <input type="text" class="node-title-input edit-field w-full bg-transparent text-lg font-bold focus:outline-none truncate" style="color:${theme.text}" value="${escapeHtml(node.title)}" placeholder="그래프 제목" />
              <div class="flex items-center gap-0.5 bg-[#fffef9] p-0.5 rounded-full border-[1.4px] border-slate-500/60 shrink-0 ui-sans">
                ${types.map(t => `
                  <button type="button" data-ctype="${t.key}" class="sketch-btn px-2 py-0.5 rounded-full text-[10px] font-bold ${cd.chartType === t.key ? 'bg-[#2c3440] text-white' : 'text-slate-600 hover:bg-slate-100'}">${t.label}</button>
                `).join('')}
              </div>
            </div>

            <div class="chart-canvas flex-1 min-h-[115px] flex items-center justify-center rounded-2xl bg-[#fffef9]/75 border border-dashed border-slate-400/55 p-2 overflow-hidden">
              ${buildSketchChartSvg(node)}
            </div>

            <div class="mt-2 flex items-center justify-between ui-sans shrink-0">
              <button type="button" class="btn-toggle-edit sketch-btn text-[11px] font-bold text-violet-700 px-2.5 py-0.5 rounded-full bg-[#fffef9] border border-slate-400/70">
                ${cd.editing ? '▲ 값 편집 닫기' : '✎ 값 빠르게 수정'}
              </button>
              <span class="text-[11px] text-slate-500">${cd.items.length}개 항목</span>
            </div>

            ${cd.editing ? `
              <div class="mt-2 p-2 rounded-2xl bg-[#fffef9]/95 border-[1.4px] border-slate-500/50 space-y-1.5 max-h-40 overflow-y-auto thin-scroll shrink-0">
                ${cd.items.map((it, idx) => `
                  <div class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full shrink-0 border border-slate-700/50" style="background:${CHART_PALETTE[idx % CHART_PALETTE.length]}"></span>
                    <input type="text" data-cidx="${idx}" data-cfield="label" class="edit-field flex-1 min-w-0 px-2 py-0.5 rounded-lg bg-white border border-slate-300 text-[15px] focus:outline-none focus:border-violet-500" value="${escapeHtml(it.label)}" placeholder="항목명" />
                    <input type="number" data-cidx="${idx}" data-cfield="value" class="edit-field w-16 px-2 py-0.5 rounded-lg bg-white border border-slate-300 text-[15px] text-right font-bold focus:outline-none focus:border-violet-500" value="${it.value}" />
                    <button type="button" data-cremove="${idx}" class="sketch-btn w-6 h-6 rounded-full text-slate-400 hover:bg-rose-50 hover:text-rose-500 text-xs">✕</button>
                  </div>
                `).join('')}
                <button type="button" class="btn-add-chart-item sketch-btn ui-sans w-full py-1 rounded-xl bg-violet-100/80 hover:bg-violet-200/80 text-violet-800 text-xs font-bold mt-1">+ 항목 추가</button>
              </div>
            ` : ''}
          </div>
        `;

        bodyEl.querySelector('.node-title-input').addEventListener('input', (e) => {
          node.title = e.target.value;
          scheduleSave();
        });

        bodyEl.querySelectorAll('button[data-ctype]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            cd.chartType = btn.dataset.ctype;
            renderChartBody(node, bodyEl, theme);
            triggerNodeBoing(node.id, 0.75);
            SoundEngine.play('click');
            scheduleSave();
          });
        });

        bodyEl.querySelector('.btn-toggle-edit').addEventListener('click', (e) => {
          e.stopPropagation();
          cd.editing = !cd.editing;
          // 편집 서랍을 열면 바로 입력할 수 있도록 편집 모드도 활성화
          selectNode(node.id, cd.editing);
          renderChartBody(node, bodyEl, theme);
          const wrapper = nodeElements.get(node.id);
          if (wrapper) {
            applyNodeSize(node, wrapper);
            updateNodeSketch(node, wrapper);
          }
          renderEdges();
          SoundEngine.play('click');
        });

        if (cd.editing) {
          bodyEl.querySelectorAll('input[data-cidx]').forEach(inp => {
            inp.addEventListener('input', () => {
              const idx = Number(inp.dataset.cidx);
              const field = inp.dataset.cfield;
              cd.items[idx][field] = field === 'value' ? (parseFloat(inp.value) || 0) : inp.value;
              const chartCanvas = bodyEl.querySelector('.chart-canvas');
              if (chartCanvas) chartCanvas.innerHTML = buildSketchChartSvg(node);
              scheduleSave();
            });
          });

          bodyEl.querySelectorAll('button[data-cremove]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              if (cd.items.length <= 1) return showToast('최소 1개 항목이 필요해요', '📊');
              pushUndo();
              cd.items.splice(Number(btn.dataset.cremove), 1);
              renderChartBody(node, bodyEl, theme);
              const wrapper = nodeElements.get(node.id);
              if (wrapper) updateNodeSketch(node, wrapper);
              renderEdges();
              SoundEngine.play('delete');
              scheduleSave();
            });
          });

          const addBtn = bodyEl.querySelector('.btn-add-chart-item');
          if (addBtn) {
            addBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              pushUndo();
              cd.items.push({ label: `항목 ${cd.items.length + 1}`, value: Math.floor(Math.random() * 55 + 20) });
              renderChartBody(node, bodyEl, theme);
              const wrapper = nodeElements.get(node.id);
              if (wrapper) updateNodeSketch(node, wrapper);
              renderEdges();
              triggerNodeBoing(node.id, 0.65);
              SoundEngine.play('spawn');
              scheduleSave();
            });
          }
        }
      }

      /* -----------------------------------------------------------------------
         14. 노드 상호작용: 어디를 잡아도 즉시 드래그 + 톡 탭하면 바로 편집!
         ----------------------------------------------------------------------- */
      let draggingNodeState = null;
      let connectingState = null;
      let resizingState = null;
      let suppressNextNodeClick = false;

      function bindNodeEvents(node, wrapper) {
        // 1) 노드 설정 툴바 - 타입 전환 (메모 / 말풍선 / 표 / 그래프)
        wrapper.querySelectorAll('button[data-switch-type]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            switchNodeType(node, btn.dataset.switchType);
          });
        });

        // 2) 색상 변경
        wrapper.querySelectorAll('button[data-color]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            pushUndo();
            node.color = btn.dataset.color;
            rerenderSingleNode(node);
            triggerNodeBoing(node.id, 0.72);
            SoundEngine.play('click');
            scheduleSave();
          });
        });

        // 3) 가지 추가 / 복제 / 삭제
        wrapper.querySelector('[data-action="branch"]').addEventListener('click', (e) => {
          e.stopPropagation();
          const pos = findSmartChildPosition(node, 'right');
          addNode(node.type === 'mindmap' ? 'mindmap' : 'memo', pos.x, pos.y, { color: node.color }, node.id, true);
        });

        wrapper.querySelector('[data-action="duplicate"]').addEventListener('click', (e) => {
          e.stopPropagation();
          const copy = JSON.parse(JSON.stringify(node));
          delete copy.id;
          copy.seed = genSeed();
          addNode(node.type, node.x + 32, node.y + 32, copy, null, false);
          showToast('손그림 카드를 복제했어요', '✏️');
        });

        wrapper.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteNode(node.id);
        });

        // 4) 연결/가지치기 (+) 핸들
        wrapper.querySelectorAll('.branch-handle').forEach(handle => {
          handle.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const side = handle.dataset.handle;
            const rect = getNodeRect(node);
            const startWorldX = side === 'right' ? rect.x + rect.w : rect.cx;
            const startWorldY = side === 'right' ? rect.cy : rect.y + rect.h;

            connectingState = {
              fromId: node.id,
              side,
              startScreenX: e.clientX,
              startScreenY: e.clientY,
              startWorldX,
              startWorldY,
              moved: false,
              targetNodeId: null
            };
          });
        });

        // 5) 가로·세로 크기 리사이즈 핸들
        const resizeHandle = wrapper.querySelector('.resize-handle');
        resizeHandle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          e.preventDefault();
          selectNode(node.id, false);
          const card = wrapper.querySelector('.node-card');
          resizingState = {
            node,
            wrapper,
            startX: e.clientX,
            startY: e.clientY,
            startW: node.width || wrapper.offsetWidth,
            startH: card ? card.offsetHeight : wrapper.offsetHeight,
            moved: false
          };
        });

        resizeHandle.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          pushUndo();
          node.height = null;
          applyNodeSize(node, wrapper);
          updateNodeSketch(node, wrapper);
          renderEdges();
          triggerNodeBoing(node.id, 0.55);
          SoundEngine.play('click');
          scheduleSave();
          showToast('세로 크기를 내용에 맞게 자동 조절했어요', '✨');
        });

        // 6) 카드 본체 PointerDown -> 메모·말풍선·표·그래프 상관없이 즉시 드래그 준비!
        wrapper.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          closeMorePopover();

          // 버튼, 툴바, 핸들 클릭은 각자 이벤트로 처리
          if (e.target.closest('button, .node-toolbar, .resize-handle, .branch-handle')) {
            return;
          }

          // 이미 이 노드를 편집 중이고, 실제로 텍스트 필드 내부를 터치했다면 텍스트 커서/선택을 우선
          if (state.editingNodeId === node.id && e.target.closest('.edit-field')) {
            return;
          }

          // 선택만 먼저 반영 (아직 편집 모드는 켜지 않아 드래그가 방해받지 않음)
          selectNode(node.id, false);

          const subtreeIds = e.shiftKey ? getSubtreeNodeIds(node.id) : [node.id];
          const initialPositions = new Map();
          subtreeIds.forEach(id => {
            const n = state.nodes.find(item => item.id === id);
            if (n) initialPositions.set(id, { x: n.x, y: n.y });
          });

          draggingNodeState = {
            node,
            wrapper,
            pointerId: e.pointerId,
            startClientX: e.clientX,
            startClientY: e.clientY,
            lastClientX: e.clientX,
            lastClientY: e.clientY,
            initialPositions,
            moved: false
          };

          // 잡는 순간 쫀득하게 살짝 커짐
          const p = getPhys(node.id);
          p.targetSx = 1.035;
          p.targetSy = 1.035;
          ensurePhysicsLoop();
        });

        // 7) 드래그 없이 짧게 탭/클릭했을 때 -> 즉시 해당 입력칸에 포커스하여 편집 모드 진입!
        wrapper.addEventListener('click', (e) => {
          e.stopPropagation();
          if (suppressNextNodeClick) return;
          if (e.target.closest('button, .node-toolbar, .resize-handle, .branch-handle')) return;

          // 이미 편집 중이고 입력 필드를 눌렀다면 그대로 유지
          if (state.editingNodeId === node.id && e.target.closest('.edit-field')) return;

          // 편집 모드 ON -> edit-field의 pointer-events가 즉시 auto로 바뀜
          selectNode(node.id, true);

          // 사용자가 정확히 톡 누른 좌표에 있는 입력칸(제목/본문/표 셀 등)을 찾아 바로 포커스!
          const hitEl = document.elementFromPoint(e.clientX, e.clientY);
          const field = hitEl?.closest('.edit-field')
            || (node.type === 'memo' ? wrapper.querySelector('.memo-textarea') : null)
            || wrapper.querySelector('.edit-field');

          if (field && node.type !== 'chart') {
            field.focus();
          } else if (field && hitEl?.closest('.edit-field')) {
            field.focus();
          }
        });
      }

      function rerenderSingleNode(node) {
        const oldEl = nodeElements.get(node.id);
        if (oldEl) {
          if (nodeResizeObserver) {
            const oldCard = oldEl.querySelector('.node-card');
            if (oldCard) nodeResizeObserver.unobserve(oldCard);
          }
          oldEl.remove();
        }
        renderNode(node, false);
        renderEdges();
        updateSelectionUI();
      }

      function deleteNode(id) {
        pushUndo();
        state.nodes = state.nodes.filter(n => n.id !== id);
        state.edges = state.edges.filter(e => e.from !== id && e.to !== id);
        const el = nodeElements.get(id);
        if (el) el.remove();
        nodeElements.delete(id);
        nodePhysics.delete(id);
        if (state.selectedNodeId === id) state.selectedNodeId = null;
        if (state.editingNodeId === id) state.editingNodeId = null;
        renderEdges();
        updateSelectionUI();
        SoundEngine.play('delete');
        scheduleSave();
      }

      function getSubtreeNodeIds(rootId) {
        const visited = new Set([rootId]);
        const queue = [rootId];
        while (queue.length) {
          const cur = queue.shift();
          state.edges.forEach(e => {
            if (e.from === cur && !visited.has(e.to)) {
              visited.add(e.to);
              queue.push(e.to);
            }
          });
        }
        return Array.from(visited);
      }

      /* -----------------------------------------------------------------------
         15. 선택 & 편집 상태 UI 동기화
         ----------------------------------------------------------------------- */
      function selectNode(id, editing = false) {
        state.selectedNodeId = id;
        state.editingNodeId = editing ? id : null;
        state.selectedEdgeId = null;
        updateSelectionUI();
        updateSelectedEdgeButton();
      }

      function clearSelection() {
        state.selectedNodeId = null;
        state.editingNodeId = null;
        state.selectedEdgeId = null;
        if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          document.activeElement.blur();
        }
        updateSelectionUI();
        updateSelectedEdgeButton();
      }

      function updateSelectionUI() {
        for (const [id, el] of nodeElements.entries()) {
          const isSel = id === state.selectedNodeId;
          const isEdit = id === state.editingNodeId;
          el.classList.toggle('is-selected', isSel);
          el.classList.toggle('is-editing', isEdit);
          el.style.zIndex = isSel ? '25' : '10';

          const toolbar = el.querySelector('.node-toolbar');
          if (toolbar) toolbar.classList.toggle('hidden', !isSel);

          el.querySelectorAll('.branch-handle').forEach(h => {
            h.classList.toggle('opacity-100', isSel);
          });
        }
      }

      /* -----------------------------------------------------------------------
         16. 손그림 마인드맵 곡선 연결선 렌더링
         ----------------------------------------------------------------------- */
      function getNodeRect(node) {
        const el = nodeElements.get(node.id);
        const w = el ? el.offsetWidth : (node.width || 220);
        const h = el ? el.offsetHeight : 80;
        return { x: node.x, y: node.y, w, h, cx: node.x + w / 2, cy: node.y + h / 2 };
      }

      function computeSketchEdge(r1, r2, seed = 101) {
        const rng = mulberry32(seed);
        const dx = r2.cx - r1.cx;
        const dy = r2.cy - r1.cy;

        let x1, y1, x2, y2, c1x, c1y, c2x, c2y;
        const pad = 6;

        if (Math.abs(dx) >= Math.abs(dy) * 0.7) {
          if (dx >= 0) {
            x1 = r1.x + r1.w + pad; y1 = r1.cy;
            x2 = r2.x - pad;        y2 = r2.cy;
          } else {
            x1 = r1.x - pad;        y1 = r1.cy;
            x2 = r2.x + r2.w + pad; y2 = r2.cy;
          }
          const pull = Math.max(46, Math.abs(x2 - x1) * 0.45);
          c1x = x1 + (dx >= 0 ? pull : -pull);
          c1y = y1 + (rng() - 0.5) * 14;
          c2x = x2 + (dx >= 0 ? -pull : pull);
          c2y = y2 + (rng() - 0.5) * 14;
        } else {
          if (dy >= 0) {
            x1 = r1.cx; y1 = r1.y + r1.h + pad;
            x2 = r2.cx; y2 = r2.y - pad;
          } else {
            x1 = r1.cx; y1 = r1.y - pad;
            x2 = r2.cx; y2 = r2.y + r2.h + pad;
          }
          const pull = Math.max(42, Math.abs(y2 - y1) * 0.45);
          c1x = x1 + (rng() - 0.5) * 14;
          c1y = y1 + (dy >= 0 ? pull : -pull);
          c2x = x2 + (rng() - 0.5) * 14;
          c2y = y2 + (dy >= 0 ? -pull : pull);
        }

        const midX = 0.125 * x1 + 0.375 * c1x + 0.375 * c2x + 0.125 * x2;
        const midY = 0.125 * y1 + 0.375 * c1y + 0.375 * c2y + 0.125 * y2;

        const d1 = `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;
        // 살짝 어긋난 2차 펜선으로 진짜 손그림 화살표 느낌 극대화
        const d2 = `M ${(x1 + (rng() - 0.5) * 2).toFixed(1)} ${(y1 + (rng() - 0.5) * 2).toFixed(1)} C ${(c1x + (rng() - 0.5) * 5).toFixed(1)} ${(c1y + (rng() - 0.5) * 5).toFixed(1)}, ${(c2x + (rng() - 0.5) * 5).toFixed(1)} ${(c2y + (rng() - 0.5) * 5).toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;
        const arrow = Sketch.arrowHead(x2, y2, c2x, c2y, seed);

        return { d1, d2, arrow, midX, midY };
      }

      function renderEdges() {
        edgesGroupEl.innerHTML = '';

        state.edges.forEach((edge, idx) => {
          const fromNode = state.nodes.find(n => n.id === edge.from);
          const toNode = state.nodes.find(n => n.id === edge.to);
          if (!fromNode || !toNode) return;

          const curve = computeSketchEdge(getNodeRect(fromNode), getNodeRect(toNode), edge.seed || (idx + 1) * 37);
          const theme = COLOR_THEMES[fromNode.color] || COLOR_THEMES.paper;
          const isSel = state.selectedEdgeId === edge.id;
          const strokeColor = isSel ? '#e11d48' : theme.stroke;

          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

          const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p1.setAttribute('d', curve.d1);
          p1.setAttribute('fill', 'none');
          p1.setAttribute('stroke', strokeColor);
          p1.setAttribute('stroke-width', isSel ? '3.2' : '2.1');
          p1.setAttribute('stroke-linecap', 'round');
          p1.setAttribute('stroke-opacity', isSel ? '1' : '0.78');

          const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p2.setAttribute('d', curve.d2);
          p2.setAttribute('fill', 'none');
          p2.setAttribute('stroke', strokeColor);
          p2.setAttribute('stroke-width', '1.1');
          p2.setAttribute('stroke-linecap', 'round');
          p2.setAttribute('stroke-opacity', '0.42');

          const head = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          head.setAttribute('d', curve.arrow);
          head.setAttribute('fill', 'none');
          head.setAttribute('stroke', strokeColor);
          head.setAttribute('stroke-width', isSel ? '2.8' : '2.0');
          head.setAttribute('stroke-linecap', 'round');
          head.setAttribute('stroke-linejoin', 'round');

          const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          hit.setAttribute('d', curve.d1);
          hit.setAttribute('fill', 'none');
          hit.setAttribute('stroke', 'transparent');
          hit.setAttribute('stroke-width', '20');
          hit.classList.add('edge-hit');
          hit.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            state.selectedNodeId = null;
            state.editingNodeId = null;
            state.selectedEdgeId = edge.id;
            updateSelectionUI();
            renderEdges();
            updateSelectedEdgeButton();
            SoundEngine.play('click');
          });

          g.appendChild(p1);
          g.appendChild(p2);
          g.appendChild(head);
          g.appendChild(hit);
          edgesGroupEl.appendChild(g);
        });

        updateSelectedEdgeButton();
      }

      function updateSelectedEdgeButton() {
        if (!state.selectedEdgeId) {
          edgeDeleteBtnEl.classList.add('hidden');
          return;
        }
        const edge = state.edges.find(e => e.id === state.selectedEdgeId);
        if (!edge) return edgeDeleteBtnEl.classList.add('hidden');

        const n1 = state.nodes.find(n => n.id === edge.from);
        const n2 = state.nodes.find(n => n.id === edge.to);
        if (!n1 || !n2) return edgeDeleteBtnEl.classList.add('hidden');

        const curve = computeSketchEdge(getNodeRect(n1), getNodeRect(n2), edge.seed || 101);
        const pos = worldToScreen(curve.midX, curve.midY);
        edgeDeleteBtnEl.style.left = `${pos.x - 14}px`;
        edgeDeleteBtnEl.style.top = `${pos.y - 14}px`;
        edgeDeleteBtnEl.classList.remove('hidden');
      }

      edgeDeleteBtnEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!state.selectedEdgeId) return;
        pushUndo();
        state.edges = state.edges.filter(ed => ed.id !== state.selectedEdgeId);
        state.selectedEdgeId = null;
        renderEdges();
        SoundEngine.play('delete');
        scheduleSave();
      });

      /* -----------------------------------------------------------------------
         17. 캔버스 배경 클릭 -> 기본 메모 바로 생성! (+ 패닝 & 핀치 줌)
         ----------------------------------------------------------------------- */
      const activePointers = new Map();
      let panState = null;
      let pinchState = null;
      let pendingBgClick = null;

      viewportEl.addEventListener('pointerdown', (e) => {
        if (e.target !== viewportEl && e.target !== worldEl && e.target !== document.getElementById('edges-layer')) {
          return;
        }

        // 선택된 노드나 메뉴가 열려있었는지 기록 (열려있었다면 첫 탭은 깔끔하게 닫기/해제!)
        const hadActiveUI = Boolean(
          state.selectedNodeId ||
          state.editingNodeId ||
          state.selectedEdgeId ||
          !morePopoverEl.classList.contains('hidden')
        );

        closeMorePopover();
        if (hadActiveUI) {
          clearSelection();
        }

        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // 두 손가락 핀치 줌
        if (activePointers.size === 2) {
          panState = null;
          pendingBgClick = null;
          const pts = Array.from(activePointers.values());
          pinchState = {
            startDist: Math.max(10, Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y)),
            startZoom: state.zoom,
            startPanX: state.panX,
            startPanY: state.panY,
            startMidX: (pts[0].x + pts[1].x) / 2,
            startMidY: (pts[0].y + pts[1].y) / 2
          };
          return;
        }

        // 한 손가락 / 마우스 패닝 또는 빈 배경 클릭 준비
        panState = {
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          origPanX: state.panX,
          origPanY: state.panY,
          moved: false,
          hadActiveUI
        };
        viewportEl.classList.add('is-panning');
      });

      window.addEventListener('pointermove', (e) => {
        if (activePointers.has(e.pointerId)) {
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }

        // 1) 두 손가락 핀치 줌
        if (pinchState && activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const midX = (pts[0].x + pts[1].x) / 2;
          const midY = (pts[0].y + pts[1].y) / 2;

          const newZoom = clamp(pinchState.startZoom * (dist / pinchState.startDist), 0.28, 2.4);
          const ratio = newZoom / pinchState.startZoom;

          state.zoom = newZoom;
          state.panX = midX - (pinchState.startMidX - pinchState.startPanX) * ratio;
          state.panY = midY - (pinchState.startMidY - pinchState.startPanY) * ratio;
          updateViewportTransform();
          return;
        }

        // 2) 배경 패닝
        if (panState && panState.pointerId === e.pointerId) {
          const dx = e.clientX - panState.startX;
          const dy = e.clientY - panState.startY;
          if (Math.hypot(dx, dy) > 5) panState.moved = true;
          if (panState.moved) {
            state.panX = panState.origPanX + dx;
            state.panY = panState.origPanY + dy;
            updateViewportTransform();
          }
          return;
        }

        // 3) 노드 즉시 드래그 (메모/말풍선/표/그래프 모두 동일하게 스무스!)
        if (draggingNodeState && draggingNodeState.pointerId === e.pointerId) {
          const dxScreen = e.clientX - draggingNodeState.startClientX;
          const dyScreen = e.clientY - draggingNodeState.startClientY;

          if (!draggingNodeState.moved && Math.hypot(dxScreen, dyScreen) > 5) {
            draggingNodeState.moved = true;
            pushUndo();
            if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
              document.activeElement.blur();
            }
          }

          if (draggingNodeState.moved) {
            const dxWorld = dxScreen / state.zoom;
            const dyWorld = dyScreen / state.zoom;

            draggingNodeState.initialPositions.forEach((orig, id) => {
              const target = state.nodes.find(n => n.id === id);
              if (target) {
                target.x = Math.round(orig.x + dxWorld);
                target.y = Math.round(orig.y + dyWorld);
                const el = nodeElements.get(id);
                if (el && id !== draggingNodeState.node.id) {
                  el.style.transform = `translate3d(${target.x}px, ${target.y}px, 0)`;
                }
              }
            });

            // 드래그 속도에 맞춘 뽀잉 젤리 기울기
            const vx = e.clientX - draggingNodeState.lastClientX;
            const vy = e.clientY - draggingNodeState.lastClientY;
            const p = getPhys(draggingNodeState.node.id);
            p.targetRot = clamp(vx * 0.44, -8, 8);
            const speed = Math.min(28, Math.hypot(vx, vy));
            p.targetSx = 1.035 + speed * 0.0022;
            p.targetSy = 1.035 - speed * 0.0018;
            ensurePhysicsLoop();

            draggingNodeState.lastClientX = e.clientX;
            draggingNodeState.lastClientY = e.clientY;
            renderEdges();
          }
          return;
        }

        // 4) 가로·세로 리사이즈
        if (resizingState) {
          const dx = (e.clientX - resizingState.startX) / state.zoom;
          const dy = (e.clientY - resizingState.startY) / state.zoom;
          if (!resizingState.moved && Math.hypot(dx, dy) > 3) {
            resizingState.moved = true;
            pushUndo();
          }
          if (resizingState.moved) {
            const minHMap = { mindmap: 56, memo: 92, table: 150, chart: 210 };
            const minH = minHMap[resizingState.node.type] || 80;
            const newW = clamp(Math.round(resizingState.startW + dx), 150, 680);
            const newH = clamp(Math.round(resizingState.startH + dy), minH, 680);
            resizingState.node.width = newW;
            resizingState.node.height = newH;
            applyNodeSize(resizingState.node, resizingState.wrapper);
            updateNodeSketch(resizingState.node, resizingState.wrapper);
            renderEdges();
          }
          return;
        }

        // 5) 고무줄 연결선 드래그
        if (connectingState) {
          if (Math.hypot(e.clientX - connectingState.startScreenX, e.clientY - connectingState.startScreenY) > 8) {
            connectingState.moved = true;
          }
          if (connectingState.moved) {
            const curWorld = screenToWorld(e.clientX, e.clientY);
            const dx = curWorld.x - connectingState.startWorldX;
            const pull = Math.max(40, Math.abs(dx) * 0.45);
            const d = `M ${connectingState.startWorldX} ${connectingState.startWorldY} C ${connectingState.startWorldX + (dx >= 0 ? pull : -pull)} ${connectingState.startWorldY}, ${curWorld.x + (dx >= 0 ? -pull : pull)} ${curWorld.y}, ${curWorld.x} ${curWorld.y}`;
            tempEdgeEl.setAttribute('d', d);
            tempEdgeEl.classList.remove('hidden');

            let foundId = null;
            for (const n of state.nodes) {
              if (n.id === connectingState.fromId) continue;
              const r = getNodeRect(n);
              if (curWorld.x >= r.x - 16 && curWorld.x <= r.x + r.w + 16 && curWorld.y >= r.y - 16 && curWorld.y <= r.y + r.h + 16) {
                foundId = n.id;
                break;
              }
            }
            connectingState.targetNodeId = foundId;
            for (const [id, el] of nodeElements.entries()) {
              el.classList.toggle('is-drop-target', id === foundId);
            }
          }
        }
      });

      function handlePointerEnd(e) {
        activePointers.delete(e.pointerId);

        if (pinchState && activePointers.size < 2) {
          pinchState = null;
          scheduleSave();
        }

        // 빈 배경 패닝/클릭 종료
        if (panState && panState.pointerId === e.pointerId) {
          const { moved, hadActiveUI } = panState;
          panState = null;
          viewportEl.classList.remove('is-panning');
          if (moved) {
            scheduleSave();
          } else if (!hadActiveUI) {
            // 빈 배경을 깔끔하게 클릭/탭 -> click 이벤트에서 바로 메모 생성!
            pendingBgClick = { x: e.clientX, y: e.clientY };
          }
        }

        // 노드 드래그 종료 -> 뽀잉 착지!
        if (draggingNodeState && draggingNodeState.pointerId === e.pointerId) {
          const { node, moved } = draggingNodeState;
          draggingNodeState = null;
          const p = getPhys(node.id);
          p.targetSx = 1;
          p.targetSy = 1;
          p.targetRot = 0;

          if (moved) {
            suppressNextNodeClick = true;
            setTimeout(() => { suppressNextNodeClick = false; }, 60);
            triggerNodeBoing(node.id, 0.98);
            SoundEngine.play('boing');
            scheduleSave();
          } else {
            ensurePhysicsLoop();
          }
        }

        // 리사이즈 종료
        if (resizingState) {
          const rs = resizingState;
          resizingState = null;
          if (rs.moved) {
            triggerNodeBoing(rs.node.id, 0.45);
            SoundEngine.play('click');
            scheduleSave();
          }
        }

        // 연결선 드래그 종료
        if (connectingState) {
          const cs = connectingState;
          connectingState = null;
          tempEdgeEl.classList.add('hidden');
          for (const el of nodeElements.values()) el.classList.remove('is-drop-target');

          const fromNode = state.nodes.find(n => n.id === cs.fromId);
          if (!fromNode) return;

          if (!cs.moved) {
            const pos = findSmartChildPosition(fromNode, cs.side);
            addNode(fromNode.type === 'mindmap' ? 'mindmap' : 'memo', pos.x, pos.y, { color: fromNode.color }, fromNode.id, true);
          } else if (cs.targetNodeId) {
            const exists = state.edges.some(ed =>
              (ed.from === cs.fromId && ed.to === cs.targetNodeId) ||
              (ed.from === cs.targetNodeId && ed.to === cs.fromId)
            );
            if (!exists) {
              pushUndo();
              state.edges.push({ id: genId('e'), from: cs.fromId, to: cs.targetNodeId, seed: genSeed() });
              renderEdges();
              triggerNodeBoing(cs.targetNodeId, 1.0);
              SoundEngine.play('boing');
              scheduleSave();
            }
          } else {
            const dropWorld = screenToWorld(e.clientX, e.clientY);
            addNode(fromNode.type === 'mindmap' ? 'mindmap' : 'memo', dropWorld.x - 105, dropWorld.y - 45, { color: fromNode.color }, fromNode.id, true);
          }
        }
      }

      window.addEventListener('pointerup', handlePointerEnd);
      window.addEventListener('pointercancel', handlePointerEnd);

      // 배경 클릭 -> 그 자리에 기본 손그림 메모가 뽀잉! 생성 (click 이벤트 내에서 포커스하므로 모바일 키보드도 완벽 동작)
      viewportEl.addEventListener('click', (e) => {
        if (!pendingBgClick) return;
        const { x, y } = pendingBgClick;
        pendingBgClick = null;

        if (e.target !== viewportEl && e.target !== worldEl && e.target !== document.getElementById('edges-layer')) {
          return;
        }

        const worldPos = screenToWorld(x, y);
        addNode('memo', worldPos.x - 118, worldPos.y - 54, {
          color: 'lemon',
          title: '',
          content: ''
        }, null, true);
      });

      // 마우스 휠 줌 (PC)
      viewportEl.addEventListener('wheel', (e) => {
        const scrollable = e.target.closest('.thin-scroll');
        if (scrollable && scrollable.scrollHeight > scrollable.clientHeight) return;
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.91;
        zoomAt(e.clientX, e.clientY, state.zoom * factor);
      }, { passive: false });

      /* -----------------------------------------------------------------------
         18. 마인드맵 자동 정렬
         ----------------------------------------------------------------------- */
      function autoArrangeMindmap() {
        if (!state.nodes.length) return;
        pushUndo();

        const hasParent = new Set(state.edges.map(e => e.to));
        let roots = state.nodes.filter(n => !hasParent.has(n.id));
        if (!roots.length) roots = [state.nodes[0]];

        const visited = new Set();
        let currentRootY = 80;

        function layoutSubtree(nodeId, x, yStart) {
          visited.add(nodeId);
          const node = state.nodes.find(n => n.id === nodeId);
          const rect = getNodeRect(node);
          const children = state.edges
            .filter(e => e.from === nodeId && !visited.has(e.to))
            .map(e => e.to);

          if (!children.length) {
            node.x = Math.round(x);
            node.y = Math.round(yStart);
            return yStart + rect.h + 48;
          }

          let cursorY = yStart;
          const childYs = [];
          children.forEach(cid => {
            const cNode = state.nodes.find(n => n.id === cid);
            const beforeY = cursorY;
            cursorY = layoutSubtree(cid, x + rect.w + 96, cursorY);
            childYs.push(cNode.y + getNodeRect(cNode).h / 2);
            if (cursorY === beforeY) cursorY += 100;
          });

          const avgCenterY = (childYs[0] + childYs[childYs.length - 1]) / 2;
          node.x = Math.round(x);
          node.y = Math.round(avgCenterY - rect.h / 2);
          return Math.max(cursorY, node.y + rect.h + 48);
        }

        roots.forEach(r => {
          if (!visited.has(r.id)) {
            currentRootY = layoutSubtree(r.id, 80, currentRootY) + 42;
          }
        });

        state.nodes.forEach(n => {
          if (!visited.has(n.id)) {
            n.x = 80;
            n.y = currentRootY;
            currentRootY += getNodeRect(n).h + 50;
          }
        });

        state.nodes.forEach(n => {
          const el = nodeElements.get(n.id);
          if (el) el.style.transform = `translate3d(${n.x}px, ${n.y}px, 0)`;
          triggerNodeBoing(n.id, 0.85);
        });

        renderEdges();
        fitView(true);
        SoundEngine.play('boing');
        scheduleSave();
        showToast('마인드맵을 깔끔하게 정리했어요!', '✨');
      }

      /* -----------------------------------------------------------------------
         19. 우측 상단 초미니 메뉴 & 키보드 단축키
         ----------------------------------------------------------------------- */
      function closeMorePopover() {

      });

        const typedName = storageNameInputEl.value.trim();
        saveCurrentToBrowser({ asNew: true, customName: typedName });
        storageNameInputEl.value = state.currentBoardName;
      });

      storageNameInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {

          document.getElementById('btn-modal-save-new').click();
        }
      });

      document.getElementById('btn-modal-export-file').addEventListener('click', () => {
        exportBoardToFile();
      });

      const fileInput = document.getElementById('file-import-input');
      document.getElementById('btn-import').addEventListener('click', () => {
        closeMorePopover();
        fileInput.value = '';
        fileInput.click();
      });

      document.getElementById('btn-modal-import-file').addEventListener('click', () => {
        fileInput.value = '';
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!Array.isArray(parsed.nodes) || !Array.isArray(parsed.edges)) throw new Error();
            pushUndo();
            state.nodes = parsed.nodes;
            state.edges = parsed.edges;
            state.currentSlotId = null;
            state.currentBoardName = (parsed.name || file.name.replace(/\.json$/i, '')).trim();
            clearSelection();
            renderAll();
            if (typeof parsed.panX === 'number' && typeof parsed.panY === 'number' && typeof parsed.zoom === 'number') {
              state.panX = parsed.panX;
              state.panY = parsed.panY;
              state.zoom = clamp(parsed.zoom, 0.28, 2.4);
              updateViewportTransform();
            } else {
              fitView(true);
            }
            closeStorageModal();
            saveWorkingStateNow();
            SoundEngine.play('spawn');
            showToast(`"${state.currentBoardName}" 파일을 불러왔어요!`, '📂');
          } catch (err) {

      document.getElementById('btn-load-sample').addEventListener('click', () => {

          icon: '✏️',
          okText: '불러오기',
          onConfirm: () => {
            pushUndo();
            loadStarterTemplate();
            SoundEngine.play('spawn');
            showToast('손그림 예시가 뽀잉! 열렸어요', '✨');
          }
        });
      });

      document.getElementById('btn-clear-all').addEventListener('click', () => {
        closeMorePopover();
        showConfirm({
          title: '모눈종이를 깨끗이 비울까요?',
          desc: '빈 종이를 클릭하면 언제든 새 메모가 뽀잉 생겨요!',
          icon: '🧹',
          okText: '비우기',
          onConfirm: () => {
            pushUndo();
            state.nodes = [];
            state.edges = [];
            clearSelection();
            renderAll();
            scheduleSave();
            SoundEngine.play('delete');
            showToast('깨끗한 모눈종이만 남겼어요!', '✏️');
          }
        });
      });

      window.addEventListener('keydown', (e) => {
        const activeTag = document.activeElement?.tagName;
        const isTyping = activeTag === 'INPUT' || activeTag === 'TEXTAREA';

        // Ctrl+S / Cmd+S -> 브라우저에 저장
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          saveCurrentToBrowser({ asNew: false });
          return;
        }

        // Ctrl+Z -> 되돌리기 / Ctrl+Y (또는 Ctrl+Shift+Z) -> 다시 실행
        if ((e.ctrlKey || e.metaKey) && !isTyping) {
          const key = e.key.toLowerCase();
          if (key === 'y' || (key === 'z' && e.shiftKey)) {
            e.preventDefault();
            performRedo();
            return;
          }
          if (key === 'z') {
            e.preventDefault();
            performUndo();
            return;
          }
        }

        if (e.key === 'Escape') {
          closeMorePopover();
          closeStorageModal();
          clearSelection();
          return;
        }

        if (isTyping) return;

        if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedNodeId) {
          e.preventDefault();
          deleteNode(state.selectedNodeId);
        } else if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedEdgeId) {
          e.preventDefault();
          pushUndo();
          state.edges = state.edges.filter(ed => ed.id !== state.selectedEdgeId);
          state.selectedEdgeId = null;
          renderEdges();
          SoundEngine.play('delete');
          scheduleSave();
        } else if (e.key === 'Tab' && state.selectedNodeId) {
          e.preventDefault();
          const parent = state.nodes.find(n => n.id === state.selectedNodeId);
          if (parent) {
            const pos = findSmartChildPosition(parent, 'right');
            addNode(parent.type === 'mindmap' ? 'mindmap' : 'memo', pos.x, pos.y, { color: parent.color }, parent.id, true);
          }
        }
      });

      window.addEventListener('resize', () => {
        updateSelectedEdgeButton();
      });

      /* -----------------------------------------------------------------------
         20. 첫 실행용 손그림 스타터 스케치
         ----------------------------------------------------------------------- */
      function loadStarterTemplate() {

        state.nodes = [

            type: 'mindmap',

            y: 230,
            width: 205,
            color: 'sky',
            title: '✏️ 아이디어 스케치'
          },
          {
            id: memoId,
            seed: 2048,
            type: 'memo',
            x: 380,
            y: 55,
            width: 255,
            color: 'lemon',
            title: '이렇게 써보세요!',
            content: '• 빈 모눈종이를 클릭하면 메모가 바로 뽀잉!\n• 어느 카드든 잡으면 바로 드래그, 톡 누르면 입력\n• 위 설정 바에서 메모↔말풍선↔표↔그래프 변환!'
          },
          {
            id: tableId,
            seed: 3072,
            type: 'table',
            x: 380,
            y: 260,
            width: 295,
            color: 'mint',
            title: '주간 목표 체크',
            tableData: {
              headers: ['할 일', '달성', '메모'],
              rows: [
                ['기획', '95', '완료'],
                ['스케치', '80', '재밌음'],
                ['정리', '60', '진행중']
              ]
            }
          },
          {
            id: chartId,
            seed: 4096,
            type: 'chart',
            x: 760,
            y: 220,
            width: 300,
            color: 'lavender',
            title: '달성률 그래프',
            chartData: {
              chartType: 'bar',
              editing: false,
              items: [
                { label: '기획', value: 95 },
                { label: '스케치', value: 80 },
                { label: '정리', value: 60 }
              ]
            }
          }
        ];

        state.edges = [
          { id: 'e_1', from: rootId, to: memoId, seed: 501 },
          { id: 'e_2', from: rootId, to: tableId, seed: 502 },
          { id: 'e_3', from: tableId, to: chartId, seed: 503 }
        ];

        renderAll();
        setTimeout(() => fitView(false), 50);
        scheduleSave();
      }

      /* -----------------------------------------------------------------------
         21. 앱 초기화
         ----------------------------------------------------------------------- */
      function init() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.nodes) && Array.isArray(parsed.edges)) {
              state.nodes = parsed.nodes;
              state.edges = parsed.edges;
              state.panX = typeof parsed.panX === 'number' ? parsed.panX : 0;
              state.panY = typeof parsed.panY === 'number' ? parsed.panY : 0;
              state.zoom = typeof parsed.zoom === 'number' ? clamp(parsed.zoom, 0.28, 2.4) : 1;
              state.currentSlotId = parsed.currentSlotId || null;
              state.currentBoardName = parsed.currentBoardName || '';
              renderAll();
              updateViewportTransform();
              updateUndoButton();
              return;
            }
          }
        } catch (e) {
          // 저장 데이터 오류 시 기본 스케치로 복구
        }

        loadStarterTemplate();
        updateUndoButton();
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
